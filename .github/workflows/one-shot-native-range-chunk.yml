name: One-shot compound range chunk patch

on:
  push:
    branches:
      - gpt/native-range-chunk-20260912

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce, patch, and verify
        run: node .github/scripts/patch-native-range-chunk.cjs
      - name: Commit verified patch and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/scripts/patch-native-range-chunk.cjs .github/workflows/one-shot-native-range-chunk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep compound native-number ranges in one phrase'
          git push origin HEAD:gpt/native-range-chunk-20260912

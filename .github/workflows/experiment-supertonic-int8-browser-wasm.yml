name: Experiment Supertonic browser composite u5

on:
  push:
    branches:
      - experiment/supertonic-int8-browser-wasm-20260912

permissions:
  contents: read

jobs:
  browser-composite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser + DSP weapons
        working-directory: /tmp
        run: |
          set -euo pipefail
          rm -rf st-browser
          mkdir -p st-browser
          cd st-browser
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund \
            vite@5.4.0 \
            onnxruntime-web@1.17.0 \
            @audio/pitch@2.0.4 \
            @audio/shift@1.1.4 \
            playwright
          npx playwright install --with-deps chromium

      - name: Download public FP16 model + official web helper
        working-directory: /tmp/st-browser
        run: |
          set -euo pipefail
          mkdir -p public/assets/onnx public/assets/voice_styles public/ort src
          BASE='https://huggingface.co/Kyumdroid/supertonic-3-quant/resolve/main'
          for f in duration_predictor.onnx text_encoder.onnx vector_estimator.onnx vocoder.onnx tts.json unicode_indexer.json; do
            curl -fL --retry 3 --retry-delay 2 "$BASE/fp16/onnx/$f" -o "public/assets/onnx/$f"
          done
          for v in F2 F4; do
            curl -fL --retry 3 "$BASE/voice_styles/$v.json" -o "public/assets/voice_styles/$v.json"
          done
          curl -fL --retry 3 'https://raw.githubusercontent.com/supertone-oss-archive/supertonic/main/web/helper.js' -o src/helper.js
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm public/ort/
          du -ch public/assets/onnx/* | tail -1

      - name: Build real browser u5 composite harness
        working-directory: /tmp/st-browser
        run: |
          cat > index.html <<'HTML'
          <!doctype html><html><body><pre id="status">boot</pre><script type="module" src="/src/app.js"></script></body></html>
          HTML
          cat > src/app.js <<'JS'
          import * as ort from 'onnxruntime-web';
          import { yin } from '@audio/pitch';
          import { formant, lpc } from '@audio/shift';
          import { loadTextToSpeech, Style, writeWavFile } from './helper.js';

          ort.env.wasm.numThreads = 1;
          ort.env.wasm.wasmPaths = '/ort/';

          const status = document.getElementById('status');
          const say = s => { status.textContent = s; console.log(s); };
          const flatten = x => x.flat(Infinity);

          async function blendStyle(spec) {
            const docs = await Promise.all(spec.map(async ([name]) => {
              const r = await fetch('/assets/voice_styles/' + name + '.json');
              if (!r.ok) throw new Error('style ' + name + ' HTTP ' + r.status);
              return r.json();
            }));
            const td = docs[0].style_ttl.dims, dd = docs[0].style_dp.dims;
            const ttl = new Float32Array(td[1] * td[2]);
            const dp = new Float32Array(dd[1] * dd[2]);
            spec.forEach(([name, w], i) => {
              const a = flatten(docs[i].style_ttl.data), b = flatten(docs[i].style_dp.data);
              for (let j=0;j<ttl.length;j++) ttl[j] += a[j] * w;
              for (let j=0;j<dp.length;j++) dp[j] += b[j] * w;
            });
            return new Style(
              new ort.Tensor('float32', ttl, [1, td[1], td[2]]),
              new ort.Tensor('float32', dp, [1, dd[1], dd[2]])
            );
          }

          function trim(x, sr, thresholdDb=-45, padMs=50) {
            const frame = Math.max(1, Math.floor(sr * .01));
            const n = Math.floor(x.length/frame);
            if (n < 3) return Float32Array.from(x);
            const rms = new Float32Array(n); let mx = 0;
            for (let i=0;i<n;i++) {
              let s=0; const st=i*frame;
              for(let j=0;j<frame;j++){ const v=x[st+j]; s+=v*v; }
              rms[i]=Math.sqrt(s/frame+1e-12); if(rms[i]>mx) mx=rms[i];
            }
            const cut = mx * Math.pow(10, thresholdDb/20);
            let a=0,b=n-1; while(a<n && rms[a]<=cut)a++; while(b>a && rms[b]<=cut)b--;
            if(a>=n) return Float32Array.from(x);
            const pad=Math.floor(sr*padMs/1000);
            return Float32Array.from(x.slice(Math.max(0,a*frame-pad), Math.min(x.length,(b+1)*frame+pad)));
          }

          function tailTrim(x, sr, keepMs=60) {
            const frame=Math.max(1,Math.floor(sr*.01)), n=Math.floor(x.length/frame);
            if(n<3) return Float32Array.from(x);
            let mx=0; const rms=new Float32Array(n);
            for(let i=0;i<n;i++){let s=0;for(let j=0;j<frame;j++){const v=x[i*frame+j];s+=v*v;}rms[i]=Math.sqrt(s/frame+1e-12);mx=Math.max(mx,rms[i]);}
            const cut=mx*Math.pow(10,-42/20); let last=n-1; while(last>0&&rms[last]<=cut)last--;
            const end=Math.min(x.length,(last+1)*frame+Math.floor(sr*keepMs/1000));
            return Float32Array.from(x.slice(0,end));
          }

          function preShape(input, sr) {
            let x=trim(input,sr,-45,50);
            const fade=Math.min(Math.floor(sr*.01),Math.floor(x.length/2));
            for(let i=0;i<fade;i++){const g=i/Math.max(1,fade-1);x[i]*=g;x[x.length-1-i]*=g;}
            const onset=Math.min(Math.floor(sr*.15),x.length);
            for(let i=0;i<onset;i++){const g=2-(i/Math.max(1,onset-1));x[i]*=g;}
            return x;
          }

          function u5RatioTrack(x, sr, question=false) {
            const frame=1024, hop=Math.max(1,Math.floor(sr*.01));
            const rows=[];
            for(let i=0;i+frame<=x.length;i+=hop){
              const p=yin(x.subarray(i,i+frame),{fs:sr,minFreq:70,maxFreq:500,threshold:.15});
              rows.push({t:(i+frame/2)/sr, f:p&&p.clarity>=.50?p.freq:0, clarity:p?p.clarity:0});
            }
            const voiced=rows.filter(r=>r.f>0);
            if(voiced.length<5) return {rows,ratio:()=>1,voiced:voiced.length};
            const meanLog=voiced.reduce((s,r)=>s+Math.log(r.f),0)/voiced.length;
            let vi=0; const nv=voiced.length, step=hop/sr, tailN=Math.max(1,Math.round(.2/step));
            for(const r of rows){
              if(!(r.f>0)){r.ratio=1;continue;}
              const d=Math.log(r.f)-meanLog;
              let target=meanLog+(d>0?d*1.8:d)+Math.log(Math.pow(2,1/12));
              const elapsed=vi*step;
              let hat;
              if(elapsed<.2) hat=-1+(1.3)*(elapsed/.2);
              else hat=.3+(-.8)*((vi-Math.round(.2/step))/Math.max(1,nv-Math.round(.2/step)));
              target += Math.log(Math.pow(2,hat/12));
              if(vi>=nv-tailN){
                const q=(vi-(nv-tailN))/Math.max(1,tailN-1);
                target += Math.log(Math.pow(2,((question?8:6)*q)/12));
              }
              r.ratio=Math.exp(target-Math.log(r.f)); vi++;
            }
            const ratio=t=>{
              const k=Math.max(0,Math.min(rows.length-1,Math.round((t*sr-frame/2)/hop)));
              return rows[k]?.ratio || 1;
            };
            return {rows,ratio,voiced:nv};
          }

          function postShape(x, sr) {
            x=tailTrim(x,sr,60); let peak=0; for(const v of x)peak=Math.max(peak,Math.abs(v));
            if(peak>0){const g=.89/peak;for(let i=0;i<x.length;i++)x[i]*=g;}
            return x;
          }

          function stats(x,sr){let sq=0,p=0;for(const v of x){sq+=v*v;p=Math.max(p,Math.abs(v));}return {seconds:+(x.length/sr).toFixed(3),rms:+Math.sqrt(sq/Math.max(1,x.length)).toFixed(6),peak:+p.toFixed(6)};}
          function bytesWav(x,sr){return Array.from(new Uint8Array(writeWavFile(Array.from(x),sr)));}

          async function main(){
            say('loading model'); const t0=performance.now();
            const {textToSpeech}=await loadTextToSpeech('/assets/onnx',{executionProviders:['wasm'],graphOptimizationLevel:'all'});
            const loadSeconds=(performance.now()-t0)/1000;
            const style=await blendStyle([['F4',.6],['F2',.4]]);
            const text='예비군 훈련은 해마다 받습니다.';
            say('synthesizing'); const t1=performance.now();
            const raw=await textToSpeech.call(text,'ko',style,8,.966,.25);
            const n=Math.floor(textToSpeech.sampleRate*raw.duration[0]);
            const base=Float32Array.from(raw.wav.slice(0,n));
            const pre=preShape(base,textToSpeech.sampleRate);
            const track=u5RatioTrack(pre,textToSpeech.sampleRate,false);
            say('formant shaping'); const tf=performance.now();
            const f=postShape(Float32Array.from(formant(pre,{ratio:track.ratio,sampleRate:textToSpeech.sampleRate})),textToSpeech.sampleRate);
            const formantSeconds=(performance.now()-tf)/1000;
            say('lpc shaping'); const tl=performance.now();
            const l=postShape(Float32Array.from(lpc(pre,{ratio:track.ratio,sampleRate:textToSpeech.sampleRate})),textToSpeech.sampleRate);
            const lpcSeconds=(performance.now()-tl)/1000;
            const result={
              browser:true, provider:'wasm', model:'Kyumdroid/supertonic-3-quant/fp16',
              recipe:'u5-browser-composite:F4.6+F2.4 + trim/fade/onset + YIN + variable formant/LPC + tail/peak',
              load_seconds:+loadSeconds.toFixed(3), synth_seconds:+((performance.now()-t1)/1000-formantSeconds-lpcSeconds).toFixed(3),
              formant_seconds:+formantSeconds.toFixed(3), lpc_seconds:+lpcSeconds.toFixed(3), voiced_frames:track.voiced,
              base:stats(base,textToSpeech.sampleRate), formant:stats(f,textToSpeech.sampleRate), lpc:stats(l,textToSpeech.sampleRate),
              paid_tts_api_calls:0, cloudflare_calls:0,
              files:{'base.wav':bytesWav(base,textToSpeech.sampleRate),'u5-formant.wav':bytesWav(f,textToSpeech.sampleRate),'u5-lpc.wav':bytesWav(l,textToSpeech.sampleRate)}
            };
            window.__result=result; window.__done=true; say('done');
          }
          main().catch(e=>{window.__error=String(e&&e.stack||e);window.__done=true;say('ERROR '+window.__error);});
          JS

          cat > run.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('[browser]',m.type(),m.text()));
          page.on('pageerror',e=>console.error('[pageerror]',e));
          await page.goto('http://127.0.0.1:5173',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>window.__done===true,{timeout:240000});
          const err=await page.evaluate(()=>window.__error||null); if(err) throw new Error(err);
          const result=await page.evaluate(()=>window.__result);
          for(const [name,bytes] of Object.entries(result.files)){fs.writeFileSync(name,Buffer.from(bytes));}
          delete result.files; fs.writeFileSync('result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(!result.browser||result.formant.rms<.01||result.lpc.rms<.01||result.cloudflare_calls!==0) process.exitCode=2;
          await browser.close();
          NODE

      - name: Run real Chromium WASM + composite DSP
        working-directory: /tmp/st-browser
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 5173 >/tmp/st-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          node run.mjs

      - name: Upload browser composite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-browser-u5-composite
          retention-days: 1
          if-no-files-found: warn
          path: |
            /tmp/st-browser/result.json
            /tmp/st-browser/base.wav
            /tmp/st-browser/u5-formant.wav
            /tmp/st-browser/u5-lpc.wav
            /tmp/st-vite.log

name: Experiment Supertonic browser u5 five-case screen

on:
  push:
    branches:
      - experiment/supertonic-int8-browser-wasm-20260912

permissions:
  contents: read

jobs:
  browser-five-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install minimal browser harness
        working-directory: /tmp
        run: |
          set -euo pipefail
          rm -rf st-browser
          mkdir -p st-browser
          cd st-browser
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund vite@5.4.0 onnxruntime-web@1.17.0 playwright
          npx playwright install --with-deps chromium

      - name: Download public FP16 model and styles
        working-directory: /tmp/st-browser
        run: |
          set -euo pipefail
          mkdir -p public/assets/onnx public/assets/voice_styles public/ort src
          BASE='https://huggingface.co/Kyumdroid/supertonic-3-quant/resolve/main'
          for f in duration_predictor.onnx text_encoder.onnx vector_estimator.onnx vocoder.onnx tts.json unicode_indexer.json; do
            curl -fL --retry 3 --retry-delay 2 "$BASE/fp16/onnx/$f" -o "public/assets/onnx/$f"
          done
          for v in F2 F4; do
            curl -fL --retry 3 "$BASE/voice_styles/$v.json" -o "public/assets/voice_styles/$v.json"
          done
          curl -fL --retry 3 'https://raw.githubusercontent.com/supertone-oss-archive/supertonic/main/web/helper.js' -o src/helper.js
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm public/ort/

      - name: Build five-case browser harness
        working-directory: /tmp/st-browser
        run: |
          cat > index.html <<'HTML'
          <!doctype html><html><body><pre id="status">boot</pre><script type="module" src="/src/app.js"></script></body></html>
          HTML
          cat > src/app.js <<'JS'
          import * as ort from 'onnxruntime-web';
          import { loadTextToSpeech, Style, writeWavFile } from './helper.js';
          ort.env.wasm.numThreads = 1;
          ort.env.wasm.wasmPaths = '/ort/';
          const flatten=x=>x.flat(Infinity);
          const cases=[
            ['ordinary-medium','국방부장관은 전쟁이 없는 때에도 정해진 날수만큼 예비군을 불러 쓸 수 있습니다.'],
            ['legal-chain','제육 조 제일 항 제삼 호 가목을 적용한다.'],
            ['date-range-particle','이천이십육 년 구 월 십일 일부터 이천이십육 년 구 월 십이 일까지 시행한다.'],
            ['mil-k2','케이투 전차를 점검한다.'],
            ['mil-kf21','케이에프 이십일 비행시험을 실시한다.']
          ];
          async function blendStyle(){
            const docs=await Promise.all(['F4','F2'].map(async n=>(await fetch('/assets/voice_styles/'+n+'.json')).json()));
            const td=docs[0].style_ttl.dims,dd=docs[0].style_dp.dims;
            const ttl=new Float32Array(td[1]*td[2]),dp=new Float32Array(dd[1]*dd[2]);
            const weights=[.6,.4];
            docs.forEach((d,i)=>{const a=flatten(d.style_ttl.data),b=flatten(d.style_dp.data);for(let j=0;j<ttl.length;j++)ttl[j]+=a[j]*weights[i];for(let j=0;j<dp.length;j++)dp[j]+=b[j]*weights[i]});
            return new Style(new ort.Tensor('float32',ttl,[1,td[1],td[2]]),new ort.Tensor('float32',dp,[1,dd[1],dd[2]]));
          }
          function stats(x,sr){let sq=0,p=0;for(const v of x){sq+=v*v;p=Math.max(p,Math.abs(v))}return{seconds:+(x.length/sr).toFixed(3),rms:+Math.sqrt(sq/Math.max(1,x.length)).toFixed(6),peak:+p.toFixed(6)}}
          function wavBytes(x,sr){return Array.from(new Uint8Array(writeWavFile(Array.from(x),sr)))}
          async function main(){
            const t0=performance.now();
            const {textToSpeech}=await loadTextToSpeech('/assets/onnx',{executionProviders:['wasm'],graphOptimizationLevel:'all'});
            const load_seconds=+(performance.now()-t0).toFixed(0)/1000;
            const style=await blendStyle();
            const out=[];const files={};
            for(const [id,text] of cases){
              console.log('synth',id);const t=performance.now();
              const raw=await textToSpeech.call(text,'ko',style,8,.966,.25);
              const synth_seconds=+(performance.now()-t).toFixed(0)/1000;
              const n=Math.floor(textToSpeech.sampleRate*raw.duration[0]);
              const audio=Float32Array.from(raw.wav.slice(0,n));
              const s=stats(audio,textToSpeech.sampleRate);
              if(s.rms<.005||s.peak<.02)throw new Error('near-silence '+id+' '+JSON.stringify(s));
              out.push({id,text,synth_seconds,...s});
              files[id+'.wav']=wavBytes(audio,textToSpeech.sampleRate);
            }
            window.__result={browser:true,provider:'wasm',model:'Kyumdroid/supertonic-3-quant/fp16',recipe:'F4:0.6,F2:0.4 steps=8 speed=.966 no server DSP',load_seconds,cases:out,paid_tts_api_calls:0,cloudflare_calls:0,files};
            window.__done=true;
          }
          main().catch(e=>{window.__error=String(e&&e.stack||e);window.__done=true});
          JS
          cat > run.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage();
          page.on('console',m=>console.log('[browser]',m.text()));page.on('pageerror',e=>console.error('[pageerror]',e));
          await page.goto('http://127.0.0.1:5173',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>window.__done===true,null,{timeout:120000});
          const err=await page.evaluate(()=>window.__error||null);if(err)throw new Error(err);
          const result=await page.evaluate(()=>window.__result);
          for(const [name,bytes] of Object.entries(result.files))fs.writeFileSync(name,Buffer.from(bytes));
          delete result.files;fs.writeFileSync('result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          if(result.cloudflare_calls!==0||result.paid_tts_api_calls!==0)process.exitCode=2;
          await browser.close();
          NODE

      - name: Run real Chromium WASM five-case screen
        working-directory: /tmp/st-browser
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 5173 >/tmp/st-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          node run.mjs

      - name: Upload browser five-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-browser-u5-five-case
          retention-days: 1
          if-no-files-found: warn
          path: |
            /tmp/st-browser/result.json
            /tmp/st-browser/*.wav
            /tmp/st-vite.log

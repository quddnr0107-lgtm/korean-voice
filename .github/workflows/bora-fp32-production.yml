name: Bora FP32 course production
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - 'bora-production/request.json'
permissions:
  contents: read
concurrency:
  group: bora-fp32-production-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  ORT_DISABLE_TELEMETRY: '1'

jobs:
  preflight:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      course: ${{ steps.checked.outputs.course }}
      render_settings_sha256: ${{ steps.checked.outputs.render_settings_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned runtime without source or media keys
        run: bash bora-production/setup_runtime.sh
      - name: Check producer, checkpoint, transport and assembly contracts
        run: python -m unittest discover -s bora-production -p 'test_*.py'
      - name: Download exact revision-pinned models without keys
        run: python bora-production/download_models.py
      - name: Exercise real FP32 speech, ASR and assembly offline with a public sentence
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=BORA_HOST_NETNS,BORA_MODEL,BORA_ASR,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS,ORT_DISABLE_TELEMETRY,HF_HUB_DISABLE_TELEMETRY,DO_NOT_TRACK,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/runtime.py preflight --output "$RUNNER_TEMP/bora-runtime-smoke.json"
      - id: checked
        name: Export only the verified public course and settings fingerprint
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP'])/'bora-runtime-smoke.json').read_text())
          assert result['status'] == 'public_runtime_smoke_passed'
          assert result['source_key_used'] is False and result['private_manuscript_read'] is False
          assert result['course'] in ('TB', 'DR', 'RL', 'MS')
          assert re.fullmatch('[a-f0-9]{64}', result['render_settings_sha256'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('course='+result['course']+'\n')
              output.write('render_settings_sha256='+result['render_settings_sha256']+'\n')
          PY

  plan:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lessons: ${{ steps.plan.outputs.lessons }}
      course: ${{ steps.plan.outputs.course }}
      plan_artifact_id: ${{ steps.public_plan.outputs.artifact-id }}
    env:
      BORA_COURSE: ${{ needs.preflight.outputs.course }}
      BORA_SETTINGS_SHA256: ${{ needs.preflight.outputs.render_settings_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only source-envelope cryptography without keys
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - id: plan
        name: Authenticate sealed sources and emit an offline plan without manuscript text
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/runtime.py plan --output "$RUNNER_TEMP/bora-plan/public-plan.json" \
            --github-output "$GITHUB_OUTPUT" --settings-sha "$BORA_SETTINGS_SHA256"
      - name: Prepare the separate ciphertext staging release without source or media keys
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/transport.py prepare --course "$BORA_COURSE"
      - id: public_plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-fp32-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bora-plan/public-plan.json
          retention-days: 3
          if-no-files-found: error

  render:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 330
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BORA_COURSE: ${{ needs.plan.outputs.course }}
      BORA_LESSON: ${{ matrix.lesson_id }}
      BORA_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/bora-plan
      - name: Install the checked runtime without keys
        timeout-minutes: 20
        run: bash bora-production/setup_runtime.sh
      - name: Download pinned local models without keys
        timeout-minutes: 20
        run: python bora-production/download_models.py
      - name: Download previous encrypted checkpoints without source or media keys
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/transport.py download --course "$BORA_COURSE" --lesson "$BORA_LESSON" --out "$RUNNER_TEMP/bora-resume"
      - id: render
        name: Render and authenticate units offline with immediate encrypted checkpoints
        # runtime stops at its 270-minute soft budget; this step leaves time to
        # upload already sealed checkpoints before the 330-minute job ceiling.
        timeout-minutes: 285
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,ADMIN_LAW_PREMIUM_MEDIA_KEY_B64,BORA_HOST_NETNS,BORA_MODEL,BORA_ASR,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS,ORT_DISABLE_TELEMETRY,HF_HUB_DISABLE_TELEMETRY,DO_NOT_TRACK,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/runtime.py render --lesson-id "$BORA_LESSON" --shard "$BORA_SHARD" \
            --plan "$RUNNER_TEMP/bora-plan/public-plan.json" --resume-dir "$RUNNER_TEMP/bora-resume" \
            --output "$RUNNER_TEMP/bora-cipher"
      - name: Preserve ciphertext checkpoints even after a render failure
        if: ${{ always() && steps.render.outcome != 'skipped' }}
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/transport.py upload --course "$BORA_COURSE" --directory "$RUNNER_TEMP/bora-cipher"

  assemble:
    needs: [plan, render]
    # A failed shard cannot cancel complete lessons. The offline assembler must
    # independently authenticate complete coverage before its output can leave.
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 45
    # Staging remains a draft release; reading its inventory requires push access.
    # This token is exposed only to the keyless download step below.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.lessons) }}
    env:
      BORA_COURSE: ${{ needs.plan.outputs.course }}
      BORA_LESSON: ${{ matrix.lesson_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/bora-plan
      - name: Install only encoders, arrays and cryptography without keys
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check numpy==2.5.4 cryptography==50.0.0
          python -m pip check
      - name: Download all encrypted checkpoints for this lesson without source or media keys
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/transport.py download --course "$BORA_COURSE" --lesson "$BORA_LESSON" --out "$RUNNER_TEMP/bora-resume"
      - name: Verify full lesson coverage and seal final audio and manuscript offline
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,ADMIN_LAW_PREMIUM_MEDIA_KEY_B64,BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/runtime.py assemble --lesson-id "$BORA_LESSON" \
            --plan "$RUNNER_TEMP/bora-plan/public-plan.json" --resume-dir "$RUNNER_TEMP/bora-resume" \
            --output "$RUNNER_TEMP/bora-assembled"
      - name: Retain only a completed lesson's encrypted final assets for collection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-fp32-assembled-${{ matrix.lesson_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bora-assembled/*.bin
            ${{ runner.temp }}/bora-assembled/*.descriptor.json
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [plan, assemble]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BORA_COURSE: ${{ needs.plan.outputs.course }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public envelope validators without source or media keys
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bora-fp32-assembled-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/bora-course
      - name: Create an index only when the entire requested course is complete
        run: python bora-production/runtime.py index --course "$BORA_COURSE" --directory "$RUNNER_TEMP/bora-course"
      - name: Publish the complete encrypted course with its index last
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/transport.py publish --course "$BORA_COURSE" --directory "$RUNNER_TEMP/bora-course"

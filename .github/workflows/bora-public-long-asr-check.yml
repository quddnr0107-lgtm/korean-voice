name: Bora public long-unit ASR diagnosis
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/cpu-public-asr-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: bora-public-long-asr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate public-only scope and unchanged production
        id: scope
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/runtime.py bora-production/fp32_renderer.py bora-production/pilot_render.py bora-production/quality.py .github/workflows/bora-fp32-production.yml bora-production/tb001-asr-crosscheck-request.json
          python -m unittest discover -s bora-production -p 'test_cpu_public_asr_check.py' -v
          python -m py_compile bora-production/cpu_public_asr_check.py
          python - <<'PY'
          import os,sys,json
          sys.path.insert(0,'bora-production')
          import cpu_public_asr_check as c
          c.keyless()
          r=c.validate_request(json.loads(c.REQUEST.read_text()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('artifact_id='+str(r['artifact_id'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.scope.outputs.artifact_id }}
          run-id: 43533278937
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/public-long-input
      - name: Verify all public waveforms before any recognition
        run: |
          python - <<'PY'
          import sys,os,json
          sys.path.insert(0,'bora-production')
          import cpu_public_asr_check as c
          r=c.validate_request(json.loads(c.REQUEST.read_text()))
          c.validate_inputs(os.environ['RUNNER_TEMP']+'/public-long-input',r)
          print('Four public WAVs and exact PCM parity verified')
          PY
      - name: Install only pinned CPU recognition dependencies
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1 ctranslate2==4.9.0 av==18.1.0 soundfile==0.14.0 numpy==2.5.4 scipy==1.18.1 onnxruntime==1.31.1 huggingface-hub==0.36.2
      - name: Check the actual WAV decoder API before model downloads
        run: |
          python - <<'PY'
          import os,av
          from pathlib import Path
          assert av.__version__ == '18.1.0'
          source=Path(os.environ['RUNNER_TEMP'])/'public-long-input'/'00-eager-explain.wav'
          with av.open(str(source),mode='r',metadata_errors='ignore') as container:
              frame=next(container.decode(audio=0))
              assert frame.sample_rate == 24000 and frame.samples > 0
          print('Pinned PyAV accepted the faster-whisper decoder API and decoded a verified public WAV frame')
          PY
      - name: Download and authenticate two public recognition models
        run: python bora-production/cpu_public_asr_check.py download-models --models "$RUNNER_TEMP/public-asr-models"
      - name: Diagnose the two public fixtures without expected-text prompts
        run: timeout --signal=TERM --kill-after=30s 1000s python bora-production/cpu_public_asr_check.py inspect --models "$RUNNER_TEMP/public-asr-models" --input "$RUNNER_TEMP/public-long-input" --output "$RUNNER_TEMP/public-asr-result.json"
      - name: Retain public recognition diagnostics and partial results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-public-asr-${{ github.run_id }}
          path: ${{ runner.temp }}/public-asr-result.json
          retention-days: 3
          if-no-files-found: warn

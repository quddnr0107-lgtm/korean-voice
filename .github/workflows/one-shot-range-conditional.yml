name: One-shot generic range conditional patch

on:
  push:
    branches:
      - gpt/range-conditional-suffix-20260912

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce, patch, and verify
        run: node .github/scripts/patch-range-conditional.cjs
      - name: Commit verified patch and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/scripts/patch-range-conditional.cjs .github/workflows/one-shot-range-conditional.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep conditional suffixes on the right range endpoint'
          git push origin HEAD:gpt/range-conditional-suffix-20260912

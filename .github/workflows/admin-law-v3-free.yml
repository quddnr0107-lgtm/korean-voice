name: Admin law v3 one approved free lesson
on:
  push:
    branches: [admin-law-v3-free-20261027]
    paths: ['admin-law-v3-free/**', '.github/workflows/admin-law-v3-free.yml']
permissions:
  contents: read
concurrency:
  group: admin-law-v3-free-${{ github.sha }}
  cancel-in-progress: false
jobs:
  render:
    if: github.run_attempt == 1 && github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r admin-law-v3-free/requirements-pinned.txt
      - name: Pinned public model and recipe
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/assets"
          mkdir -p "$A"/{onnx,voice_styles,py}
          B=https://huggingface.co/Supertone/supertonic-3/resolve/3cadd1ee6394adea1bd021217a0e650ede09a323
          for f in config.json onnx/duration_predictor.onnx onnx/text_encoder.onnx onnx/tts.json onnx/unicode_indexer.json onnx/vector_estimator.onnx onnx/vocoder.onnx voice_styles/F2.json LICENSE; do curl --fail --location --retry 2 --max-time 180 -o "$A/$f" "$B/$f"; done
          curl --fail --location --retry 2 --max-time 60 -o "$A/py/helper.py" https://raw.githubusercontent.com/supertone-oss-archive/supertonic/1e9799e964ea4c0dad7cde993b65c3c813a7b373/py/helper.py
          echo '907f5ec81b4f7302ffbdadedd37a0d6c283b2d85696fa2f59a62cdf44dcd44a8  admin-law-v3-free/server/voice_shape_k2.py' | sha256sum -c -
      - name: Render exactly one approved free lesson
        env:
          ADMIN_ASSETS: ${{ runner.temp }}/assets
          ADMIN_OUTPUT: ${{ runner.temp }}/free-output
        run: python admin-law-v3-free/code/render_one_free.py admin-law-v3-free/scope.json admin-law-v3-free/input.json admin-law-v3-free/server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-free-lesson
          path: ${{ runner.temp }}/free-output/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-free-lesson
          path: ${{ runner.temp }}/incoming
      - name: Validate and publish only immutable free assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python admin-law-v3-free/code/publish_one_free.py admin-law-v3-free/scope.json admin-law-v3-free/input.json "$RUNNER_TEMP/incoming"

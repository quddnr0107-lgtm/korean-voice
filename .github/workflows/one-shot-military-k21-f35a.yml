name: One-shot military K21 F35A pronunciation

on:
  push:
    branches:
      - gpt/military-k21-f35a-pronunciation-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/military-k21-f35a-pronunciation-20260912
          fetch-depth: 0
      - name: Reproduce, patch, and run full static regression
        run: node .github/scripts/patch-military-k21-f35a.cjs
      - name: Remove one-shot helpers and commit verified patch
        run: |
          rm -f .github/scripts/patch-military-k21-f35a.cjs
          rm -f .github/workflows/one-shot-military-k21-f35a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ko-voice.js test/ko-voice.test.cjs .github
          git commit -m 'fix: normalize grounded K21 and F-35A Korean pronunciations'
          git push origin HEAD:gpt/military-k21-f35a-pronunciation-20260912

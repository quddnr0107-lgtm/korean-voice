name: Store verified Bora MP3s in private Yebijun
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/bora-private-yebijun.yml, bora-production/private-final15-ready.json]
permissions:
  contents: read
concurrency: bora-private-yebijun
jobs:
  export:
    # GitHub requires push access to read a draft release. Source calls remain GET-only.
    permissions:
      contents: write
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.event.head_commit.message != 'Prepare private receipt-based import for the 15 original Bora lessons'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: admin-law-premium-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d99883bb7fe2539b599e07feb182f0cedb878a71
          persist-credentials: false
      - name: Read the reviewed descriptor pins for newly assembled lessons
        if: startsWith(github.event.head_commit.message, 'Store final Bora originals privately:')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ready-input
          persist-credentials: false
          sparse-checkout: |
            bora-production/private-final15-ready.json
          sparse-checkout-cone-mode: false
      - name: Verify private destination and initialize partial checkout
        env:
          GH_TOKEN: ${{ secrets.YEBIJUN_AUDIO_WRITE_TOKEN }}
        run: |
          set -eu
          repo=quddnr0107-lgtm/yebijun-muhanhoidok234
          gh api "repos/$repo" --jq 'select(.private == true and .permissions.push == true) | .full_name' | grep -Fx "$repo"
          gh auth setup-git
          git clone --filter=blob:none --no-checkout --single-branch --depth=1 --branch audio/import-bora-originals-v4 "https://github.com/$repo.git" "$RUNNER_TEMP/dest"
          cd "$RUNNER_TEMP/dest"
          git sparse-checkout init --no-cone
          git sparse-checkout set '/.gitattributes'
          git checkout
          git lfs install --local
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
      - name: Prepare decoder and pinned reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Authenticate archives offline and checkpoint private MP3s
        env:
          FINAL15_REQUESTED: ${{ startsWith(github.event.head_commit.message, 'Store final Bora originals privately:') }}
          SOURCE_TOKEN: ${{ github.token }}
          DEST_TOKEN: ${{ secrets.YEBIJUN_AUDIO_WRITE_TOKEN }}
          MEDIA_KEY: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          set -eu
          umask 077
          final_pins="$GITHUB_WORKSPACE/ready-input/bora-production/private-final15-ready.json"
          export FINAL_PINS="$final_pins"
          export GH_TOKEN="$DEST_TOKEN"
          dest="$RUNNER_TEMP/dest"
          cat > "$RUNNER_TEMP/unpack.py" <<'PY'
          import base64, io, json, os, sys, subprocess, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0, str(Path('bora-production').resolve()))
          import v4_original_283 as source
          from namespace_guard import validate_snapshot
          import socket
          validate_snapshot(os.getuid(), int(sys.argv[3]), socket.if_nameindex(), Path('/proc/net/route').read_text(), os.readlink('/proc/self/ns/net'), sys.argv[4], Path('/proc/net/ipv6_route').read_text())
          key = base64.b64decode(os.environ.pop('MEDIA_KEY'), validate=True)
          dest = Path(sys.argv[2])
          for lesson in sorted(Path(sys.argv[1]).iterdir()):
              ident = lesson.name
              folder = dest / 'private-assets/bora-audio' / ident.split('-')[0]
              folder.mkdir(exist_ok=True, parents=True)
              path = folder / (ident + '.mp3')
              with tempfile.TemporaryDirectory() as tmp:
                  work = Path(tmp)
                  if ident == 'MS-034':
                      from ms034_owner_export import recover
                      package = recover(lesson, key)
                  else:
                      package = source.recover(lesson, ident, key)
                  with zipfile.ZipFile(io.BytesIO(package)) as archive:
                      if ident in ["MS-005","MS-006","MS-021","MS-028","MS-031","MS-054","MS-071","MS-073","MS-075","MS-094","MS-097","MS-103","MS-115","MS-141","MS-144"]:
                          metadata = json.loads(archive.read('metadata.json'))
                          if (metadata.get('recipe_sha256') != 'd3d35666712d276c0fa60bb5c5b1f7ab7d11c7042d490c95bb6fb8846682502d'
                                  or metadata.get('render_settings_sha256') != '5597ef328c8f1381e634e45a00b11dd556a8423597d7dfc80771f3085649dd32'
                                  or metadata.get('automatic_unit_checks_passed') is not True):
                              raise ValueError('New lesson original recipe or unit checks differ')
                      parts = sorted(n for n in archive.namelist() if n.startswith('part-') and n.endswith('.mp3'))
                      if not parts: raise ValueError('Missing audio')
                      for n in parts: (work / n).write_bytes(archive.read(n))
                  playlist = work / 'parts.txt'
                  playlist.write_text(''.join(f"file '{n}'\n" for n in parts))
                  track = work / 'original.mp3'
                  subprocess.run(['ffmpeg','-nostdin','-v','error','-f','concat','-safe','1','-i',str(playlist),'-map_metadata','-1','-c:a','copy',str(track)], check=True)
                  subprocess.run(['ffmpeg','-nostdin','-v','error','-xerror','-i',str(track),'-f','null','-'], check=True)
                  if path.exists() and path.read_bytes() != track.read_bytes(): raise ValueError('Existing audio differs')
                  if not path.exists(): path.write_bytes(track.read_bytes())
          PY
          cat > "$RUNNER_TEMP/fetch-batch.py" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('bora-production').resolve()))
          import ms034_owner_export as special
          import v4_original_283 as source
          import transport
          group, out = sys.argv[1], Path(sys.argv[2])
          if group.startswith('MS-') and group != 'MS-034':
              import json, os, hashlib
              pins = json.loads(Path(os.environ['FINAL_PINS']).read_text())
              folder = out / group
              backend = transport.GitHubBackend()
              release = backend.release(source.ms.TAG)
              if release is None or release['id'] != source.ms.RELEASE or release['draft'] is not True:
                  raise ValueError('Original encrypted release identity')
              result = transport.collect_final('MS', folder, group, backend, profile='single_pass')
              descriptor = folder / (group + '.descriptor.json')
              if result['collected'] != [group] or hashlib.sha256(descriptor.read_bytes()).hexdigest() != pins[group]:
                  raise ValueError('Original descriptor differs from verified production receipt')
          elif group == 'MS-034':
              backend = transport.GitHubBackend()
              rel = backend.release(source.ms.TAG)
              if not rel or (rel['id'], rel['tag_name'], rel['draft']) != (source.ms.RELEASE, source.ms.TAG, True):
                  raise ValueError('MS source release identity')
              assets = transport._assets(backend, rel)
              folder = out / group
              folder.mkdir(parents=True)
              for name, (size, sha) in special.ASSETS.items():
                  a = assets[name]
                  if (a['size'], a['digest']) != (size, 'sha256:'+sha):
                      raise ValueError('MS-034 source differs from reviewed original')
                  source.fetch(backend, a, folder / name, size)
              special.verify_pins(folder, special.ASSETS)
          else:
              ids = [group] if group == 'TB-001' else source.plan()[group]
              source.download(out, ids)
          PY
          if test "$FINAL15_REQUESTED" = true; then
            test -s "$final_pins"
            groups=$(env -u GH_TOKEN -u DEST_TOKEN -u SOURCE_TOKEN -u MEDIA_KEY python - "$final_pins" <<'PY'
          import json, re, sys
          from pathlib import Path
          pins = json.loads(Path(sys.argv[1]).read_text())
          allowed = set(["MS-005","MS-006","MS-021","MS-028","MS-031","MS-054","MS-071","MS-073","MS-075","MS-094","MS-097","MS-103","MS-115","MS-141","MS-144"])
          if not isinstance(pins, dict) or not pins or not set(pins) <= allowed or not all(isinstance(v, str) and re.fullmatch(r'[a-f0-9]{64}', v) for v in pins.values()):
              raise ValueError('Unknown lesson or invalid descriptor pin')
          print(' '.join(sorted(pins)))
          PY
            )
          else
            groups="MS-034 $(seq -f 'v4-%02g' 9 18) TB-001"
          fi
          for group in $groups; do
            stage=$(mktemp -d)
            env -u GH_TOKEN -u DEST_TOKEN -u SOURCE_TOKEN -u MEDIA_KEY python - "$group" > "$stage/paths" <<'PY'
          import sys
          sys.path.insert(0, 'bora-production')
          from v4_original_283 import plan
          group = sys.argv[1]
          ids = [group] if group == 'TB-001' or group.startswith('MS-') else plan()[group]
          for ident in ids:
              print(f"private-assets/bora-audio/{ident[:2]}/{ident}.mp3")
          PY
            git -C "$dest" ls-tree -r --name-only HEAD -- private-assets/bora-audio > "$stage/tracked"
            if test -z "$(comm -23 <(LC_ALL=C sort "$stage/paths") <(LC_ALL=C sort "$stage/tracked"))"; then
              rm -rf "$stage"
              continue
            fi
            { echo '/.gitattributes'; sed 's|^|/|' "$stage/paths"; sed -E 's|/[^/]+$|/.gitattributes|;s|^|/|' "$stage/paths" | sort -u; } > "$stage/sparse"
            git -C "$dest" sparse-checkout set --no-cone --stdin < "$stage/sparse"
            env -u GH_TOKEN -u DEST_TOKEN -u SOURCE_TOKEN -u MEDIA_KEY GITHUB_TOKEN="$SOURCE_TOKEN" python "$RUNNER_TEMP/fetch-batch.py" "$group" "$stage/input"
            sudo --preserve-env=MEDIA_KEY unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" "$RUNNER_TEMP/unpack.py" "$stage/input" "$dest" "$(id -u)" "$(readlink /proc/self/ns/net)"
            while IFS= read -r file; do
              test -s "$dest/$file"
              if test "$(stat -c %s "$dest/$file")" -gt 104857600; then
                (cd "$(dirname "$dest/$file")" && git lfs track --filename "$(basename "$file")" >/dev/null)
              fi
            done < "$stage/paths"
            git -C "$dest" add --sparse --pathspec-from-file="$stage/paths"
            while IFS= read -r attr; do
              if test -f "$dest/$attr"; then git -C "$dest" add --sparse -- "$attr"; fi
            done < <(sed -E 's|/[^/]+$|/.gitattributes|' "$stage/paths" | sort -u)
            rm -rf "$stage"
            if ! git -C "$dest" diff --cached --quiet; then
              git -C "$dest" commit -m "Store authenticated Bora originals $group"
              git -C "$dest" pull --rebase origin audio/import-bora-originals-v4
              GH_TOKEN="$DEST_TOKEN" git -C "$dest" push origin HEAD:refs/heads/audio/import-bora-originals-v4
            fi
          done

name: Kim Bora TB-001 paragraph pilot
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - 'kim-bora-tb-pilot/request.json'
permissions:
  contents: read
concurrency:
  group: kim-bora-tb001-pilot-20261112
  cancel-in-progress: true
jobs:
  preflight:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the shared system and Python runtime without keys
        run: bash kim-bora-tb-pilot/setup_runtime.sh
      - name: Verify public configuration and sealed-result boundaries
        run: python -m unittest discover -s kim-bora-tb-pilot -p 'test_*.py'
      - name: Download and validate the exact model files without keys
        run: python kim-bora-tb-pilot/download_models.py
      - name: Public sentence through the real offline TTS, ASR and audio encoders
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=BORA_HOST_NETNS,BORA_MODEL,BORA_ASR,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS,ORT_DISABLE_TELEMETRY,HF_HUB_DISABLE_TELEMETRY,DO_NOT_TRACK,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            kim-bora-tb-pilot/keyless-preflight.py --output "$RUNNER_TEMP/bora-runtime-smoke.json"
      - id: matrix
        name: Schedule protected groups only after the public runtime smoke passes
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          checked=json.loads((Path(os.environ['RUNNER_TEMP'])/'bora-runtime-smoke.json').read_text())
          assert checked['status']=='public_runtime_smoke_passed'
          assert checked['source_key_used'] is False and checked['private_manuscript_read'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(checked['matrix'],separators=(',',':'))+'\n')
          PY
  render:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the same checked system and Python runtime without keys
        run: bash kim-bora-tb-pilot/setup_runtime.sh
      - name: Download revision-pinned local models without secrets
        run: python kim-bora-tb-pilot/download_models.py
      - name: Protected exact-source check, offline synthesis, ASR and recipient encryption
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          BORA_GROUP: ${{ matrix.group }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,BORA_HOST_NETNS,BORA_MODEL,BORA_ASR,BORA_GROUP,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS,ORT_DISABLE_TELEMETRY,HF_HUB_DISABLE_TELEMETRY,DO_NOT_TRACK,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            kim-bora-tb-pilot/run.py --group "$BORA_GROUP" --output "$RUNNER_TEMP/bora-cipher"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-tb001-cipher-${{ matrix.group }}
          path: ${{ runner.temp }}/bora-cipher/*.sealed.json
          retention-days: 3
          if-no-files-found: error
  collect:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bora-tb001-cipher-*
          merge-multiple: true
          path: bora-cipher
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kim-bora-tb001-sealed-preview
          path: bora-cipher/*.sealed.json
          retention-days: 3
          if-no-files-found: error
      - name: Separate encrypted preview release, no existing asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kim-bora-tb-pilot/publish_cipher.py

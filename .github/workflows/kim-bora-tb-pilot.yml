name: Kim Bora TB-001 paragraph pilot
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - 'kim-bora-tb-pilot/request.json'
permissions:
  contents: read
concurrency:
  group: kim-bora-tb001-pilot-20261112
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      status: ${{ steps.plan.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Keyless validation dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Verify scope and sealed-result boundary
        run: python -m unittest discover -s kim-bora-tb-pilot -p 'test_*.py'
      - name: Compare operating manuscript before model downloads
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            kim-bora-tb-pilot/run.py --check-only --output "$RUNNER_TEMP/bora-check"
      - id: plan
        name: Schedule verified unit groups
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          checked=json.loads((Path(os.environ['RUNNER_TEMP'])/'bora-check'/'plan-public.json').read_text())
          assert checked['status'] in ('source_and_plan_match','source_mismatch_render_not_started')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('status='+checked['status']+'\n')
              if checked['status']=='source_and_plan_match':
                  f.write('matrix='+json.dumps(checked['matrix'],separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.plan.outputs.status == 'source_mismatch_render_not_started'
        with:
          name: bora-tb001-source-diagnostic
          path: ${{ runner.temp }}/bora-check/source-diagnostic.sealed.json
          retention-days: 3
          if-no-files-found: error
  render:
    needs: plan
    if: needs.plan.outputs.status == 'source_and_plan_match'
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU synthesis and independent ASR without secrets
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check qwen-tts==0.1.1 transformers==4.57.3 faster-whisper==1.2.1 soundfile==0.14.0 cryptography==50.0.0 numpy==2.5.4 scipy==1.18.1 onnxruntime==1.31.1
          ffmpeg -version
      - name: Download revision-pinned local models without secrets
        run: python kim-bora-tb-pilot/download_models.py
      - name: Offline synthesis, independent ASR and recipient encryption
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          BORA_GROUP: ${{ matrix.group }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,BORA_HOST_NETNS,BORA_MODEL,BORA_ASR,BORA_GROUP,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS,ORT_DISABLE_TELEMETRY,HF_HUB_DISABLE_TELEMETRY,DO_NOT_TRACK,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            kim-bora-tb-pilot/run.py --group "$BORA_GROUP" --output "$RUNNER_TEMP/bora-cipher"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-tb001-cipher-${{ matrix.group }}
          path: ${{ runner.temp }}/bora-cipher/*.sealed.json
          retention-days: 3
          if-no-files-found: error
  collect:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bora-tb001-cipher-*
          merge-multiple: true
          path: bora-cipher
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kim-bora-tb001-sealed-preview
          path: bora-cipher/*.sealed.json
          retention-days: 3
          if-no-files-found: error
      - name: Separate encrypted preview release, no existing asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kim-bora-tb-pilot/publish_cipher.py
  source-diagnostic:
    needs: plan
    if: needs.plan.outputs.status == 'source_mismatch_render_not_started'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bora-tb001-source-diagnostic
          path: source-diagnostic
      - name: Publish only the recipient-encrypted source diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kim-bora-tb-pilot/publish_cipher.py --source-diagnostic

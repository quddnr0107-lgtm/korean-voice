name: Bora public SenseVoice CPU compatibility
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/cpu-public-sensevoice-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: bora-public-sensevoice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate keyless public scope before installing inference libraries
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/runtime.py bora-production/fp32_renderer.py bora-production/pilot_render.py bora-production/quality.py bora-production/assemble.py .github/workflows/bora-fp32-production.yml bora-production/tb001-asr-crosscheck-request.json
          python -S -m unittest discover -s bora-production -p 'test_cpu_public_asr_check.py' -v
          python -S -m unittest discover -s bora-production -p 'test_cpu_public_sensevoice_check.py' -v
          python -m py_compile bora-production/cpu_public_sensevoice_check.py
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'bora-production')
          import cpu_public_sensevoice_check as s
          s.validate_request(json.loads(s.REQUEST.read_text()))
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14089353182
          run-id: 43533278937
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/public-sensevoice-input
      - name: Authenticate all four public WAVs before any model preparation
        run: |
          python - <<'PY'
          import sys,os
          sys.path.insert(0,'bora-production')
          import cpu_public_sensevoice_check as s
          assert len(s.public_scope(os.environ['RUNNER_TEMP']+'/public-sensevoice-input')) == 2
          print('Frozen public input scope and exact PCM parity verified')
          PY
      - name: Install pinned CPU SenseVoice runtime without TTS or Whisper
        run: python -m pip install --disable-pip-version-check sherpa-onnx==2.0.1 sherpa-onnx-core==2.0.1 numpy==2.5.4 soundfile==0.14.0 scipy==1.18.1 huggingface-hub==0.36.2
      - name: Download only the two pinned public SenseVoice model assets
        run: python bora-production/cpu_public_sensevoice_check.py download-model --model "$RUNNER_TEMP/public-sensevoice-model"
      - name: Exercise the actual CPU recognizer on two fixed public references
        run: timeout --signal=TERM --kill-after=30s 600s python bora-production/cpu_public_sensevoice_check.py inspect --model "$RUNNER_TEMP/public-sensevoice-model" --input "$RUNNER_TEMP/public-sensevoice-input" --output "$RUNNER_TEMP/public-sensevoice-result.json"
      - name: Retain only tiny public JSON diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-public-sensevoice-${{ github.run_id }}
          path: ${{ runner.temp }}/public-sensevoice-result.json
          retention-days: 1
          if-no-files-found: warn

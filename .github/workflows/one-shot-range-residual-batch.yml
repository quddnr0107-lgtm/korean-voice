name: One-shot residual range batch
on:
  push:
    branches: [gpt/range-residual-batch-20260912]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce, patch, and verify
        run: node .github/scripts/patch-range-residual-batch.cjs
      - name: Commit verified patch and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-range-residual-batch.cjs .github/workflows/one-shot-range-residual-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close residual range normalization defects'
          git push origin HEAD:gpt/range-residual-batch-20260912

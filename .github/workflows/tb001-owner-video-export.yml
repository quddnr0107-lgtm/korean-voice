name: TB-001 owner-only voice export
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [lecture-premium/code/tb001_owner_export.py]
permissions:
  contents: read
concurrency:
  group: tb001-owner-export
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact lesson scope
        run: |
          cd lecture-premium/code
          python -m unittest -q test_tb001_owner_export.py
  export:
    needs: verify
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: admin-law-premium-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the verified existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python lecture-premium/code/tb001_owner_export.py download "$RUNNER_TEMP/tb001-inputs"
      - name: Export the existing audio in the approved offline environment
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" \
            -- "$(command -v python)" lecture-premium/code/tb001_owner_export.py export \
            "$RUNNER_TEMP/tb001-inputs" "$RUNNER_TEMP/tb001-output" \
            "$(id -u)" "$(readlink /proc/self/ns/net)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb001-owner-envelope
          path: ${{ runner.temp }}/tb001-output/TB-001.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

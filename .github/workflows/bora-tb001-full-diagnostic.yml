name: Bora sealed TB-001 complete quality diagnosis
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/tb001-full-diagnostic-request.json']
permissions:
  contents: read
concurrency:
  group: bora-full-quality-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Read-only requests on an existing draft release require push access.
    # This job uses only GET requests; never edits releases or contents.
    permissions:
      contents: write
    outputs:
      cipher_artifact_id: ${{ steps.saved.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify production, protected diagnostics and quality gate have not changed
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/runtime.py bora-production/fp32_renderer.py bora-production/quality.py bora-production/recovery_diagnostics.py bora-production/transport.py bora-production/assemble.py .github/workflows/bora-fp32-production.yml
          python -m unittest discover -s bora-production -p 'test_tb001_full_diagnostic.py' -v
          python -m py_compile bora-production/tb001_full_diagnostic.py
      - name: Install keyless ciphertext integrity validator
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Download both SHA256-pinned saved bundles, no new TTS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/tb001_full_diagnostic.py download --directory "$RUNNER_TEMP/bora-full-cipher"
      - id: saved
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-full-diagnostic-cipher-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bora-full-cipher/TB-001-s000-r43275117254-a1.zip
            ${{ runner.temp }}/bora-full-cipher/TB-001-s001-r43275117254-a1.zip
          retention-days: 2
          if-no-files-found: error
  diagnose:
    needs: transport
    if: needs.transport.result == 'success'
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.transport.outputs.cipher_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/bora-full-cipher
      - name: Install ciphertext reader without TTS/ASR models
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Verify 58 authenticated units and classify blocked causes offline
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,ADMIN_LAW_PREMIUM_MEDIA_KEY_B64,BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/tb001_full_diagnostic.py inspect --directory "$RUNNER_TEMP/bora-full-cipher" \
            --output "$RUNNER_TEMP/bora-full-quality-summary.json"
      - name: Save numeric quality evidence only, never any text or audio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-full-quality-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/bora-full-quality-summary.json
          retention-days: 7
          if-no-files-found: error

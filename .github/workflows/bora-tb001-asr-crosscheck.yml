name: Bora TB001 stronger-ASR diagnosis
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/tb001-asr-crosscheck-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: bora-tb001-stronger-asr-${{ github.ref }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  DO_NOT_TRACK: '1'
  ORT_DISABLE_TELEMETRY: '1'
jobs:
  prepare:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Confirm production, original diagnostics and quality criteria are unchanged
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/runtime.py bora-production/fp32_renderer.py bora-production/planning.py bora-production/quality.py bora-production/pilot_render.py bora-production/assemble.py bora-production/recovery_diagnostics.py .github/workflows/bora-fp32-production.yml
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python -m unittest discover -s bora-production -p 'test_tb001_asr_crosscheck.py' -v
          python -m py_compile bora-production/tb001_asr_crosscheck.py
  recheck:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14087588658
          run-id: 43532399553
          repository: quddnr0107-lgtm/korean-voice
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/bora-recheck-cipher
      - name: Install only pinned recognition and cryptography dependencies without keys
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1 av==18.1.0 soundfile==0.14.0 cryptography==50.0.0 numpy==2.5.4 scipy==1.18.1 onnxruntime==1.31.1 huggingface-hub==0.36.2 ctranslate2==4.9.0
      - name: Verify public decoder compatibility and download pinned ASR without protected keys
        run: python bora-production/tb001_asr_crosscheck.py download-model --model-path "$RUNNER_TEMP/bora-stronger-asr"
      - name: Check 28 remaining original reviews offline without expected-text prompts
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,ADMIN_LAW_PREMIUM_MEDIA_KEY_B64,BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/tb001_asr_crosscheck.py inspect --directory "$RUNNER_TEMP/bora-recheck-cipher" \
            --model-path "$RUNNER_TEMP/bora-stronger-asr" --output "$RUNNER_TEMP/bora-asr-recheck-summary.json"
      - name: Export only fixed diagnostic counts, never audio or ASR transcripts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-asr-recheck-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/bora-asr-recheck-summary.json
          retention-days: 3
          if-no-files-found: error


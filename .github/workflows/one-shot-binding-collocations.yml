name: One-shot legal and military binding collocations

on:
  push:
    branches:
      - gpt/legal-binding-collocations-20260912

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce, patch, and verify
        run: node .github/scripts/patch-binding-collocations.cjs
      - name: Commit verified patch and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/scripts/patch-binding-collocations.cjs .github/workflows/one-shot-binding-collocations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep legal and military binding collocations in one phrase'
          git push origin HEAD:gpt/legal-binding-collocations-20260912

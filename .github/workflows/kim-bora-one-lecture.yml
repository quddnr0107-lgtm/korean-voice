name: Kim Bora one requested military-service lecture
on:
  push:
    branches: [codex/kim-bora-one-lecture-20261111]
    paths: ['kim-bora-demo/**', '.github/workflows/kim-bora-one-lecture.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: kim-bora-one-lecture-20261111
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        run: |
          python - <<'PY'
          import json,os
          n=json.load(open('kim-bora-demo/config.json'))['count']
          assert 0<n<=40
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'part':list(range(n))})+'\n')
          PY
  render:
    needs: plan
    runs-on: ubuntu-24.04
    environment: admin-law-premium-production
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU inference from official registries
        run: |
          python -m pip install --quiet torch==2.15.0+cpu torchaudio==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet qwen-tts==0.1.1 transformers==4.57.3 soundfile cryptography
      - name: Download revision-pinned open model before secret access
        run: |
          python - <<'PY'
          import json,os
          from huggingface_hub import snapshot_download
          c=json.load(open('kim-bora-demo/config.json'))
          p=snapshot_download(c['model'],revision=c['revision'],local_dir=os.path.join(os.environ['RUNNER_TEMP'],'bora-model'),ignore_patterns=['*.md','.gitattributes'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('BORA_MODEL='+p+'\nBORA_RECEIVER='+os.path.join(os.environ['RUNNER_TEMP'],'bora-receiver')+'\n')
          PY
      - name: Verify existing wrapped source receiver
        env:
          GH_TOKEN: ${{ github.token }}
        run: python lecture-military-b/code/delivery.py receiver --destination "$BORA_RECEIVER"
      - name: Generate one part and seal for requester without plaintext logs
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          PART: ${{ matrix.part }}
        run: python kim-bora-demo/render.py "$PART"
      - uses: actions/upload-artifact@v4
        with:
          name: bora-cipher-${{ matrix.part }}
          path: bora-cipher/*.json
          retention-days: 2
          if-no-files-found: error
  collect:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bora-cipher-*
          merge-multiple: true
          path: bora-cipher
      - uses: actions/upload-artifact@v4
        with:
          name: kim-bora-complete-sealed-lecture
          path: bora-cipher/*.json
          retention-days: 2
          if-no-files-found: error

name: MS-034 owner-only export
on:
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - 'bora-production/ms034_owner_export.py'
      - 'bora-production/test_ms034_owner_export.py'
      - '.github/workflows/ms034-owner-export.yml'
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['.github/workflows/ms034-owner-export.yml']
permissions:
  contents: read
jobs:
  synthetic-tests:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python -m unittest discover -s bora-production -p test_ms034_owner_export.py
  export:
    needs: synthetic-tests
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    environment: admin-law-premium-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect exactly one verified ciphertext triple
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python bora-production/transport.py collect-final --profile single_pass --course MS --lesson MS-034 --out "$RUNNER_TEMP/ms034-inputs"
      - name: Authenticate original audio offline and seal to existing owner recipient
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" bora-production/ms034_owner_export.py \
            "$RUNNER_TEMP/ms034-inputs" "$RUNNER_TEMP/MS-034.owner-media.bin" \
            "$(id -u)" "$(readlink /proc/self/ns/net)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MS-034-owner-media
          path: ${{ runner.temp }}/MS-034.owner-media.bin
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

name: One-shot worker meta patch

on:
  push:
    branches:
      - feat/worker-meta-no-container-20260913
    paths:
      - .github/workflows/one-shot-worker-meta.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worker-meta-no-container-20260913
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/one-shot-worker-meta.py
          node --check worker.mjs
          node --test test/meta-no-container.test.mjs
      - name: Commit patch once
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-worker-meta.yml .github/scripts/one-shot-worker-meta.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add container-free TTS metadata endpoint'
          git push origin HEAD:feat/worker-meta-no-container-20260913

name: Keyless V4 artifact size compatibility
on:
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/v4-keyless-repack.yml, .github/actions/v4-repack-one/action.yml, bora-production/v4_repack_encrypted.py, bora-production/test_v4_repack_encrypted.py]
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/v4-keyless-repack.yml, .github/actions/v4-repack-one/action.yml, bora-production/v4_repack_encrypted.py]
permissions:
  contents: read
  actions: read
jobs:
  repack:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test ciphertext-only repacking without source access
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python -m unittest discover -s bora-production -p test_v4_repack_encrypted.py
      - if: github.event_name == 'push'
        uses: ./.github/actions/v4-repack-one
        with:
          group: v4-01
      - if: github.event_name == 'push'
        uses: ./.github/actions/v4-repack-one
        with:
          group: v4-02
      - if: github.event_name == 'push'
        uses: ./.github/actions/v4-repack-one

name: Compare TB-010 narration for owner review
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [bora-production/tb010_prosody_preview.py]
permissions:
  contents: read
concurrency:
  group: tb010-owner-prosody-preview
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: admin-law-premium-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the pinned TB-010 ciphertext, without keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bora-fp32-tb-single-pass-v1-20261114 \
            --repo quddnr0107-lgtm/korean-voice --dir "$RUNNER_TEMP/tb010" \
            --pattern 'TB-010.audio.296eb238d6a5123f39997e666436ecec.bin' \
            --pattern 'TB-010.content.c173bdd0c0653a47defadae1fed44cae.bin' \
            --pattern 'TB-010.descriptor.json'
      - name: Install the checked CPU runtime, without keys
        run: bash bora-production/setup_single_pass_runtime.sh
      - name: Download the pinned Kim Bora synthesis model, without keys
        run: bash bora-production/download_single_pass_model.sh
      - name: Compare the reported passage offline and encrypt the preview
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: |
          umask 077
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,ADMIN_LAW_PREMIUM_MEDIA_KEY_B64,BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_EVENT_NAME,GITHUB_WORKFLOW_REF,RUNNER_TEMP,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/tb010_prosody_preview.py "$RUNNER_TEMP/tb010" "$BORA_MODEL" "$RUNNER_TEMP/tb010-comparison.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb010-owner-prosody-preview
          path: ${{ runner.temp }}/tb010-comparison.bin
          retention-days: 1
          if-no-files-found: error

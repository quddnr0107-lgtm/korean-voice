name: Admin law v3 sealed premium production
on:
  push:
    branches: [admin-law-v2-premium-20261026]
    paths: ['premium-v3/launch.json']
permissions:
  contents: read
concurrency:
  group: admin-law-v3-premium-production
  cancel-in-progress: false
jobs:
  plan:
    if: github.run_attempt == 1 && github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      track: ${{ steps.plan.outputs.track }}
      queue_sha: ${{ steps.plan.outputs.queue_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - run: sha256sum -c premium-v3/CODE_SHA256.txt
      - id: plan
        run: python premium-v3/code/run_gate.py plan
      - name: Prepare only the new exact-track ciphertext release
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ steps.plan.outputs.track }}
        run: python premium-v3/code/cipher_delivery.py prepare --track "$TRACK"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: admin-law-premium-production
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TRACK: ${{ matrix.track }}
      LESSON_ID: ${{ matrix.id }}
      INPUT_ROOT: ${{ runner.temp }}/sealed-input
      QUEUE_PATH: premium-v3/inputs/${{ matrix.track }}/queue.json
      QUEUE_SHA256: ${{ needs.plan.outputs.queue_sha }}
      CHECKPOINT_DIR: ${{ runner.temp }}/checkpoint
      ADMIN_OUTPUT: ${{ runner.temp }}/cipher-output
      PLAIN_TEMP: ${{ runner.temp }}
      ADMIN_ASSETS: ${{ runner.temp }}/assets
      SERVER_DIR: premium-v3/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sha256sum -c premium-v3/CODE_SHA256.txt
      - run: python -m pip install --disable-pip-version-check -r premium-v3/requirements-pinned.txt
      - name: Pinned public model and recipe, no secrets
        run: |
          set -euo pipefail
          A="$ADMIN_ASSETS"
          mkdir -p "$A"/{onnx,voice_styles,py}
          B=https://huggingface.co/Supertone/supertonic-3/resolve/3cadd1ee6394adea1bd021217a0e650ede09a323
          for f in config.json onnx/duration_predictor.onnx onnx/text_encoder.onnx onnx/tts.json onnx/unicode_indexer.json onnx/vector_estimator.onnx onnx/vocoder.onnx voice_styles/F2.json LICENSE; do curl --fail --location --retry 2 --max-time 180 -o "$A/$f" "$B/$f"; done
          curl --fail --location --retry 2 --max-time 60 -o "$A/py/helper.py" https://raw.githubusercontent.com/supertone-oss-archive/supertonic/1e9799e964ea4c0dad7cde993b65c3c813a7b373/py/helper.py
      - name: Fetch pinned wrapped receiver and ciphertext checkpoint without keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python premium-v3/code/run_gate.py receiver
          python premium-v3/code/cipher_delivery.py checkpoint --track "$TRACK" --ids "$LESSON_ID" --directory "$CHECKPOINT_DIR"
      - name: Protected decrypt, synthesize, validate and encrypt in one process
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: python premium-v3/code/render_sealed.py "$TRACK" "$LESSON_ID"
      - name: Verify ciphertext-only artifact allowlist
        run: python premium-v3/code/cipher_delivery.py gate --track "$TRACK" --ids "$LESSON_ID" --directory "$ADMIN_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-cipher-${{ matrix.track }}-${{ matrix.id }}
          path: ${{ runner.temp }}/cipher-output/
          if-no-files-found: error
          retention-days: 7
  publish:
    if: always() && needs.plan.result == 'success'
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: sha256sum -c premium-v3/CODE_SHA256.txt
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v3-cipher-${{ needs.plan.outputs.track }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/incoming
      - name: Publish only successful assigned ciphertexts; index only at exact 68
        env:
          GH_TOKEN: ${{ github.token }}
          INCOMING: ${{ runner.temp }}/incoming
        run: python premium-v3/code/run_gate.py publish

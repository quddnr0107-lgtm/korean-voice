name: Experiment Qwen 1.7B Sohee pronunciation

on:
  push:
    branches:
      - experiment/qwen-17b-sohee-pronunciation-20260912

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zero-cost CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0
          python -m pip install qwen-tts==0.1.1 faster-whisper soundfile
      - name: Generate three canonical Korean cases with 1.7B Sohee
        run: |
          mkdir -p /tmp/q17/audio
          python - <<'PY'
          import json, resource, time, torch
          import soundfile as sf
          from qwen_tts import Qwen3TTSModel
          cases=[
            ('mil-k2','케이투 전차를 점검한다.'),
            ('legal-chain','제육 조 제일 항 제삼 호 가목을 적용한다.'),
            ('ordinary-medium','국방부장관은 전쟁이 없는 때에도 정해진 날수만큼 예비군을 불러 쓸 수 있습니다.'),
          ]
          t0=time.perf_counter()
          model=Qwen3TTSModel.from_pretrained('Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice',device_map='cpu',dtype=torch.bfloat16,attn_implementation='sdpa')
          out={'date':'2026-09-12','model':'Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice','speaker':'Sohee','dtype':'bfloat16','seed':7,'model_load_seconds':round(time.perf_counter()-t0,3),'jobs':[]}
          for cid,text in cases:
            torch.manual_seed(7)
            t=time.perf_counter()
            wavs,sr=model.generate_custom_voice(text=text,language='Korean',speaker='Sohee',instruct=None,do_sample=True,max_new_tokens=192)
            elapsed=time.perf_counter()-t
            w=wavs[0]
            sf.write(f'/tmp/q17/audio/{cid}.wav',w,sr)
            out['jobs'].append({'id':cid,'text':text,'synthesis_seconds':round(elapsed,3),'audio_seconds':round(len(w)/sr,3),'sample_rate':int(sr)})
          out['peak_rss_mb']=round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1)
          json.dump(out,open('/tmp/q17/synth.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Judge pronunciation with Whisper-small
        run: |
          python - <<'PY'
          import json, pathlib
          from faster_whisper import WhisperModel
          root=pathlib.Path('/tmp/q17')
          synth=json.load(open(root/'synth.json',encoding='utf-8'))
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          rows=[]
          for j in synth['jobs']:
            segs,info=model.transcribe(str(root/'audio'/f"{j['id']}.wav"),language='ko',beam_size=5,vad_filter=True)
            heard=' '.join(s.text.strip() for s in segs).strip()
            rows.append({**j,'asr':heard,'language_probability':round(info.language_probability,4)})
          json.dump(rows,open(root/'asr.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Compute canonical CER
        run: |
          node - <<'NODE'
          const fs=require('fs'); const K=require('./public/ko-voice.js');
          const synth=JSON.parse(fs.readFileSync('/tmp/q17/synth.json','utf8')); const rows=JSON.parse(fs.readFileSync('/tmp/q17/asr.json','utf8'));
          const compact=s=>String(s??'').replace(/[^가-힣0-9A-Za-z]/g,'');
          function cer(a,b){a=compact(a);b=compact(b);if(!a)return b?1:0;let d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const cur=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=cur;}}return d[b.length]/a.length;}
          const result=rows.map(r=>({...r,target_canonical:K.normalize(r.text),asr_canonical:K.normalize(r.asr),semantic_cer:+cer(K.normalize(r.text),K.normalize(r.asr)).toFixed(4)}));
          const out={date:'2026-09-12',goal:'test whether Qwen 1.7B preserves Sohee timbre while improving Korean pronunciation over 0.6B',execution:{paid_tts_api_calls:0,cloudflare_r2_calls:0,cloudflare_do_calls:0,cloudflare_container_calls:0},model_load_seconds:synth.model_load_seconds,peak_rss_mb:synth.peak_rss_mb,mean_semantic_cer:+(result.reduce((a,r)=>a+r.semantic_cer,0)/result.length).toFixed(4),perfect_cases:result.filter(r=>r.semantic_cer===0).length,results:result};
          fs.writeFileSync('/tmp/q17/final.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          NODE
      - name: Upload ephemeral audio and evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen-17b-sohee-pronunciation
          retention-days: 1
          path: |
            /tmp/q17/synth.json
            /tmp/q17/asr.json
            /tmp/q17/final.json
            /tmp/q17/audio/*.wav

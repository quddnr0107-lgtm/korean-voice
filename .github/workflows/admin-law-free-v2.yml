name: Administrative law - free lessons 1 to 10 only
on:
  push:
    branches: [admin-law-v2-free-20261026]
    paths: ['admin-law-v2/**', '.github/workflows/admin-law-free-v2.yml']
permissions:
  contents: read
concurrency:
  group: admin-law-v2-free-only
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release view admin-law-v2-free-20261026 --repo "$REPO" >/dev/null 2>&1 || gh release create admin-law-v2-free-20261026 --repo "$REPO" --target "$COMMIT" --title '행정법 v2 무료 1–10강 AI 음성' --notes 'Free lessons 1–10 only. AI-generated Supertonic3 k2/F2. Premium lessons 11–78 are NOT included. Assets are published individually; manifest.json marks complete set. Existing products unchanged.' --latest=false
  render:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      GH_TOKEN: ${{ github.token }}
      SHARD: ${{ matrix.shard }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Isolated paths
        run: |
          echo "ADMIN_ASSETS=$RUNNER_TEMP/admin-law-free-assets" >> "$GITHUB_ENV"
          echo "ADMIN_OUT=$RUNNER_TEMP/admin-law-free-output" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check onnxruntime numpy soundfile imageio-ffmpeg praat-parselmouth
      - name: Pinned official model and helper - no shared cache
        run: |
          set -euo pipefail
          mkdir -p "$ADMIN_ASSETS"/{onnx,voice_styles,py} "$ADMIN_OUT"
          B=https://huggingface.co/Supertone/supertonic-3/resolve/3cadd1ee6394adea1bd021217a0e650ede09a323
          for f in config.json onnx/duration_predictor.onnx onnx/text_encoder.onnx onnx/tts.json onnx/unicode_indexer.json onnx/vector_estimator.onnx onnx/vocoder.onnx voice_styles/F2.json LICENSE; do curl --fail --location --retry 2 --max-time 180 -o "$ADMIN_ASSETS/$f" "$B/$f"; done
          H=https://raw.githubusercontent.com/supertone-oss-archive/supertonic/1e9799e964ea4c0dad7cde993b65c3c813a7b373
          curl --fail --location --retry 2 --max-time 60 -o "$ADMIN_ASSETS/py/helper.py" "$H/py/helper.py"
      - name: Hash-checked checkpoints and bounded rendering
        run: python admin-law-v2/render_free.py
  publish-manifest:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect validated free lessons only
        run: |
          mkdir -p "$RUNNER_TEMP/admin-law-final"
          echo "ADMIN_OUT=$RUNNER_TEMP/admin-law-final" >> "$GITHUB_ENV"
          gh release download admin-law-v2-free-20261026 --repo "$GITHUB_REPOSITORY" --pattern 'admin-law-v2-AL-*.json' --dir "$RUNNER_TEMP/admin-law-final"
      - run: python admin-law-v2/finalize_free.py
      - name: Publish complete manifest and licenses
        run: |
          cp public/licenses/OpenRAIL-M-supertonic-3.txt "$ADMIN_OUT/model-OpenRAIL-M.txt"
          cp public/licenses/MIT-supertonic-sample-code.txt "$ADMIN_OUT/helper-MIT.txt"
          cp docs/CREDITS.md "$ADMIN_OUT/CREDITS.md"
          gh release upload admin-law-v2-free-20261026 --repo "$GITHUB_REPOSITORY" "$ADMIN_OUT/manifest.json" "$ADMIN_OUT/model-OpenRAIL-M.txt" "$ADMIN_OUT/helper-MIT.txt" "$ADMIN_OUT/CREDITS.md" --clobber

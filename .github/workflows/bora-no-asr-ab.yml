name: Compare original Bora CPU synthesis without speech recognition
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/no-asr-ab-request.json']
permissions:
  contents: read
concurrency:
  group: bora-public-no-asr-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate the fixed public scope and encoder
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/fp32_renderer.py bora-production/runtime.py bora-production/compiled-profile-request.json .github/workflows/bora-fp32-production.yml .github/workflows/bora-fp32-compiled-pilot.yml
          python bora-production/no_asr_ab_benchmark.py --validate
          python -m py_compile bora-production/no_asr_ab_collect.py
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v g++
          command -v ffprobe
          python - <<'PY'
          import re, subprocess
          p = subprocess.run(['ffmpeg','-hide_banner','-encoders'],capture_output=True,text=True,check=True)
          assert re.search(r'^\s*A\S+\s+libmp3lame\s',p.stdout,re.M)
          PY
      - name: Install only the pinned CPU synthesis runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check qwen-tts==0.1.1 transformers==4.57.3 soundfile==0.14.0 numpy==2.5.4 scipy==1.18.1 huggingface-hub==0.36.2
          python -m pip check
      - name: Download the revision-pinned TTS weights
        run: python bora-production/no_asr_preview.py download --model-dir "$RUNNER_TEMP/bora-ab-model"
      - name: Synthesize each paired public unit offline, once per mode
        env:
          PUBLIC_SHARD: ${{ matrix.shard }}
        run: |
          export BORA_HOST_NETNS="$(readlink /proc/self/ns/net)"
          timeout --signal=TERM --kill-after=20s 4480s \
            sudo --preserve-env=BORA_HOST_NETNS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,RUNNER_TEMP,OMP_NUM_THREADS,MKL_NUM_THREADS,OPENBLAS_NUM_THREADS \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" \
            bora-production/no_asr_ab_benchmark.py --shard "$PUBLIC_SHARD" --model "$RUNNER_TEMP/bora-ab-model" --output "$RUNNER_TEMP/bora-ab-shard"
      - name: Retain public MP3 and timing from this batch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-no-asr-ab-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/bora-ab-shard/*.mp3
            ${{ runner.temp }}/bora-ab-shard/summary.json
          retention-days: 1
          if-no-files-found: warn
          overwrite: true

  collect:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'bora-no-asr-ab-shard-*'
          merge-multiple: false
          path: ${{ runner.temp }}/bora-ab-input
      - name: Verify and collect the paired audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check numpy==2.5.4
          python bora-production/no_asr_ab_collect.py collect "$RUNNER_TEMP/bora-ab-input" "$RUNNER_TEMP/bora-ab-final"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-no-asr-ab-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bora-ab-final
          retention-days: 1
          if-no-files-found: error

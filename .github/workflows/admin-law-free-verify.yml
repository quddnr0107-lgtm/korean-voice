name: Verify published free administrative-law audio
on:
  push:
    branches: [admin-law-v2-free-20261026]
    paths: ['.github/workflows/admin-law-free-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch without authentication and verify all public bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/free-verify"
          cd "$RUNNER_TEMP/free-verify"
          B=https://github.com/quddnr0107-lgtm/korean-voice/releases/download/admin-law-v2-free-20261026
          curl --fail --location --retry 2 --max-time 60 -o manifest.json "$B/manifest.json"
          python3 - <<'PY'
          import json,hashlib,subprocess,pathlib
          m=json.loads(pathlib.Path('manifest.json').read_text());assert m['status']=='complete' and m['count']==10
          assert [x['number'] for x in m['lessons']]==list(range(1,11))
          for x in m['lessons']:
              assert x['access']=='free' and x['audio_url'].startswith('https://github.com/quddnr0107-lgtm/korean-voice/releases/download/admin-law-v2-free-20261026/')
              p=pathlib.Path(x['id']+'.mp3')
              subprocess.run(['curl','--fail','--location','--retry','2','--max-time','60','-o',str(p),x['audio_url']],check=True)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['audio_sha256']
              subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],check=True)
          pathlib.Path('public-url-verification.json').write_text(json.dumps({'count':10,'unauthenticated_download':True,'all_sha256_match':True,'all_mp3_decode':True,'premium_included':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: admin-law-free-verified-public-assets
          path: ${{ runner.temp }}/free-verify/
          retention-days: 1
          if-no-files-found: error

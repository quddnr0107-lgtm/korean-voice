name: V4 original audio bridge for private workspace, one approval
on:
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/v4-original-283-private.yml, bora-production/v4_original_283.py, bora-production/test_v4_original_283.py, local-receiver/open_lesson.py]
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/v4-original-283-private.yml]
permissions:
  contents: read
concurrency:
  group: ms147-owner-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate exact inventory and synthetic offline crypto; no keys or production access
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python -m unittest discover -s bora-production -p test_v4_original_283.py
          python bora-production/v4_original_283.py check
  workspace-export:
    needs: scope
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: admin-law-premium-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare space for one encrypted group at a time
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python - <<'PY_SPACE'
          import os,shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 2400000000:
              raise SystemExit('Insufficient room for a single encrypted group')
          PY_SPACE
      - name: Download exact encrypted sources for v4-01 (no media key)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python bora-production/v4_original_283.py download v4-01 "$RUNNER_TEMP/v4-input"
      - name: Authenticate original audio offline and seal v4-01 to private workspace
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" bora-production/v4_original_283.py export v4-01 "$RUNNER_TEMP/v4-input" \
            "$RUNNER_TEMP/v4-sealed" "$(id -u)" "$(readlink /proc/self/ns/net)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v4-private-original-v4-01
          path: ${{ runner.temp }}/v4-sealed/*.v4-encrypted.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Clear only the runner's staged encrypted copies of v4-01
        run: |
          rmdir -- "$RUNNER_TEMP/v4-input"
          rm -r -- "$RUNNER_TEMP/v4-sealed"
      - name: Download exact encrypted sources for v4-02 (no media key)
        env:

name: Private source safety
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security and Korean frontend regressions
        run: node --test test/private-source.test.mjs test/container-cost.test.mjs test/ko-voice.test.cjs test/frontend-invariants.test.cjs test/tts-arena.test.cjs
      - name: Container singleflight selftest
        run: python3 server/singleflight.py --selftest && python3 -m py_compile server/singleflight.py server/server.py
      - name: No private-text artifact or Container bulk queue
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const workflow = readFileSync('.github/workflows/bake.yml', 'utf8');
          assert.ok(!workflow.includes('actions/upload-artifact') && !workflow.includes('actions/download-artifact'));
          assert.ok(workflow.includes('EXPECTED_SOURCE_HASH'));
          const worker = readFileSync('worker.mjs', 'utf8');
          assert.ok(worker.includes('async alarm() { await this.baker.stop(); }'));
          assert.ok(!worker.includes('await this.baker.tick()'));
          NODE
      - name: 저장소에 굽기 중간 산출물이 없다
        run: |
          # 이 저장소는 공개다. 굽는 중간에 생기는 음성 파일은 원고를 소리로 담고 있으므로
          # 커밋되면 안 된다. 실제로 `cache/b0.tmp.wav` 한 개가 들어가 있었다.
          found=$(git ls-files | grep -E '\.(wav|mp3|opus|ogg|m4a|flac)$' || true)
          if [ -n "$found" ]; then
            echo "음성 파일이 저장소에 있다:"; echo "$found"; exit 1
          fi
          cached=$(git ls-files | grep -E '^cache/' || true)
          if [ -n "$cached" ]; then
            echo "cache/ 가 커밋돼 있다:"; echo "$cached"; exit 1
          fi
          echo "음성 파일 0개 · cache/ 0개"
      - name: Syntax checks
        run: node --check public/ko-voice.js && node --check tools/chunks.mjs && node --check worker.mjs && node --check research/tts-arena/plan.mjs

name: Publish verified RL-027 encrypted repair
on:
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - 'lecture-premium/rl027-release-request.json'
      - 'lecture-premium/code/publish_rl027_repair.py'
      - 'lecture-premium/code/test_publish_rl027_repair.py'
      - '.github/workflows/rl027-release.yml'
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['lecture-premium/rl027-release-request.json']
concurrency:
  group: rl027-verified-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - run: python -m unittest discover -s lecture-premium/code -p 'test_publish_rl027_repair.py' -v
      - run: python lecture-premium/code/publish_rl027_repair.py verify
        env: {GH_TOKEN: '${{ github.token }}'}
  publish:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.event_name == 'push' && github.ref == 'refs/heads/integrated-lectures-premium-20261028'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - run: python lecture-premium/code/publish_rl027_repair.py publish
        env: {GH_TOKEN: '${{ github.token }}'}

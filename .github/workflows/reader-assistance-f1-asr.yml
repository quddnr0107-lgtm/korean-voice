name: F1 assistance pilot independent CPU ASR

on:
  workflow_dispatch:
    inputs:
      model:
        description: Independent CPU ASR model for the same seven clips
        type: choice
        options: [small, medium]
        default: small
  push:
    branches:
      - codex/reader-assistance-f1-asr-pilot-20261105
      - codex/reader-assistance-f1-asr-medium-20261105
    paths:
      - tools/reader_assistance_asr.py
      - test/reader_assistance_asr_test.py
      - .github/workflows/reader-assistance-f1-asr.yml

permissions:
  contents: write

concurrency:
  group: reader-assistance-f1-asr-pilot
  cancel-in-progress: false

jobs:
  judge:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      ASR_MODEL: ${{ inputs.model || (github.ref_name == 'codex/reader-assistance-f1-asr-medium-20261105' && 'medium' || 'small') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Critical legal-token and full-text disagreement regressions
        run: python3 -m unittest discover -s test -p reader_assistance_asr_test.py -v
      - name: Install local CPU ASR only
        run: python3 -m pip install --quiet faster-whisper
      - name: Reuse the selected ASR model
        id: asr-model
        uses: actions/cache/restore@v4
        with:
          path: reader-assistance-asr-model
          key: reader-assistance-faster-whisper-${{ env.ASR_MODEL }}-v2
      - name: Compare seven exact published clips without regenerating them
        id: asr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/reader_assistance_asr.py --model "$ASR_MODEL" --export-review-clips reader-assistance-review-clips --publish
      - name: Retain the validated model even when transcription requires review
        if: always() && steps.asr-model.outputs.cache-hit != 'true' && hashFiles('reader-assistance-asr-model/*.ready') != ''
        uses: actions/cache/save@v4
        with:
          path: reader-assistance-asr-model
          key: reader-assistance-faster-whisper-${{ env.ASR_MODEL }}-v2
      - name: Exact review clips and both transcripts for one day
        if: always() && hashFiles('reader-assistance-review-clips/comparison.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: f1-pilot-asr-${{ env.ASR_MODEL }}-${{ github.run_id }}
          path: reader-assistance-review-clips
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Preserve review-required failure status
        if: always() && steps.asr.outcome != 'success'
        run: exit 1

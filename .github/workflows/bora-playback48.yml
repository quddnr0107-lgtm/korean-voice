name: Package verified Bora lectures for 48 kbps playback
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [bora-production/playback48-request.json]
permissions:
  contents: read
concurrency:
  group: bora-playback48-packaging
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - id: plan
        run: |
          python - <<'PY'
          import json, os
          groups=json.load(open('bora-production/playback48-request.json'))['groups']
          assert isinstance(groups,list) and groups and len(groups)==len(set(groups)) and all(type(i) is int and 0<=i<=20 for i in groups)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('groups='+json.dumps(groups),file=out)
          PY
      - run: python bora-production/playback48.py prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
  package:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    environment: admin-law-premium-production
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.prepare.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Fetch pinned ciphertext without media keys
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/input"
          python bora-production/playback48.py fetch "$GROUP" "$RUNNER_TEMP/input"
      - name: Decode, encode, verify and seal without network access
        env:
          MEDIA_KEY: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          export HOST_NS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=MEDIA_KEY,HOST_NS unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(command -v python)" bora-production/playback48.py seal "$RUNNER_TEMP/input" "$RUNNER_TEMP/output"
      - name: Upload authenticated ciphertext only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: python bora-production/playback48.py upload "$GROUP" "$RUNNER_TEMP/output"
  verify:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Verify complete courses and record the activation pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bora-production/playback48.py finish

name: Inspect RL-027 audio at 11m45s
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - lecture-premium/code/rl027_audio_check.py
      - .github/workflows/rl027-audio-check.yml
      - lecture-premium/code/test_rl027_audio_check.py
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths:
      - lecture-premium/code/rl027_audio_check.py
      - lecture-premium/code/test_rl027_audio_check.py
      - .github/workflows/rl027-audio-check.yml
permissions:
  contents: read
concurrency:
  group: rl027-published-audio-diagnosis
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test measurements and encrypted decoding using synthetic inputs
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r /dev/stdin <<'WHEEL'
          imageio-ffmpeg==0.8.1 --hash=sha256:050d6850601c3b3890bd2b28306f3b842b3daea390a561101174375a1c460bda
          WHEEL
          sudo install -m755 "$(python -c 'import imageio_ffmpeg as pkg; print(pkg.get_ffmpeg_exe())')" /usr/bin/ffmpeg
          /usr/bin/ffmpeg -version | head -n 1
          python -m pip install --disable-pip-version-check cryptography==50.0.0 numpy==2.5.4
          python -m unittest discover -s lecture-premium/code -p test_rl027_audio_check.py -v
  inspect:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.event_name == 'push' && github.ref == 'refs/heads/integrated-lectures-premium-20261028'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: admin-law-premium-production
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare fixed RL-027 ciphertext and the offline decoder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bora-fp32-rl-single-pass-v1-20261114 \
            --repo quddnr0107-lgtm/korean-voice --dir "$RUNNER_TEMP/rl027" \
            --pattern 'RL-027.descriptor.json' \
            --pattern 'RL-027.audio.3fc6e2662eeffd1e1fad5f6d97103f80.bin' \
            --pattern 'RL-027.content.1106eec1ccd4272d9b8231cf51a2526e.bin'
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r /dev/stdin <<'WHEEL'
          imageio-ffmpeg==0.8.1 --hash=sha256:050d6850601c3b3890bd2b28306f3b842b3daea390a561101174375a1c460bda
          WHEEL
          sudo install -m755 "$(python -c 'import imageio_ffmpeg as pkg; print(pkg.get_ffmpeg_exe())')" /usr/bin/ffmpeg
          /usr/bin/ffmpeg -version | head -n 1
          python -m pip install --disable-pip-version-check cryptography==50.0.0 numpy==2.5.4
      - name: Prepare the previously verified offline speech recognizer
        id: recognition
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 av==18.1.0 soundfile==0.14.0 scipy==1.18.1 onnxruntime==1.31.1 huggingface-hub==0.36.2 ctranslate2==4.9.0
          python bora-production/tb001_asr_crosscheck.py download-model --model-path "$RUNNER_TEMP/rl027-model"
      - name: Measure the reported window in the existing offline production environment
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
          MODEL_READY: ${{ steps.recognition.outcome }}
        run: |
          umask 077
          model=unavailable
          if [ "$MODEL_READY" = success ]; then model="$RUNNER_TEMP/rl027-model"; fi
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" \
            -- "$(command -v python)" lecture-premium/code/rl027_audio_check.py \
              "$RUNNER_TEMP/rl027" "$(id -u)" "$(readlink /proc/self/ns/net)" "$model"

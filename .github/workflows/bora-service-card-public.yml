name: Bora public service-card listening sample

on:
  workflow_dispatch:
  push:
    branches: [bora-service-card-20261112]
    paths:
      - '.github/workflows/bora-service-card-public.yml'
      - 'benchmarks/bora_service_card/**'

permissions:
  contents: read

concurrency:
  group: bora-public-service-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paragraph:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/bora-service-card-20261112' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ['0', '1', '2', '3']
    env:
      BORA_SAMPLE_PART: ${{ matrix.part }}
    steps:
      - name: Public repository and wall-clock boundary
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPO_PRIVATE" = false
          mkdir -p "$RUNNER_TEMP/bora-service-card-part-$BORA_SAMPLE_PART-results"
          echo "BORA_BENCH_DEADLINE=$(( $(date +%s) + 1080 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare pinned public Python runtime and model
        timeout-minutes: 6
        run: |
          set -euo pipefail
          bash benchmarks/bora_service_card/prepare.sh 2>&1 | tee "$RUNNER_TEMP/bora-service-card-part-$BORA_SAMPLE_PART-results/prepare.log"

      - name: Generate this paragraph with Python FP32
        timeout-minutes: 14
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          python benchmarks/bora_service_card/run_benchmark.py \
            --only-profile python_fp32_t4 \
            --model "$BORA_BENCH_MODEL" \
            --native /unused-native-placeholder \
            --output "$BORA_BENCH_OUTPUT"

      - name: Upload this paragraph's public audio and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-public-service-card-part-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bora-service-card-part-${{ matrix.part }}-results/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

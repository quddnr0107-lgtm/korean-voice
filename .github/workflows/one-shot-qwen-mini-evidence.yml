name: One-shot Qwen mini-batch evidence validation

on:
  push:
    branches:
      - research/qwen3-tts-mini-batch1-evidence-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/qwen3-tts-mini-batch1-evidence-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock mixed Qwen evidence in provider note and CI
        run: |
          node <<'NODE'
          const fs = require('fs');
          const providersPath = 'research/tts-arena/providers.json';
          const p = JSON.parse(fs.readFileSync(providersPath, 'utf8'));
          const q = p.providers.find(x => x.id === 'qwen3-tts-0.6b-customvoice-sohee');
          if (!q) throw new Error('Qwen provider missing');
          q.notes = 'Official Korean support with native Sohee preset. Verified 2026-09-12 on a 4-core GitHub Ubuntu CPU runner. Sampling is required: do_sample=false produced near-silence at the token cap, while sampled inference produced normal Korean speech. K2 and KF-21 tied raw vs canonical; the tested date range improved with ko-voice, while the tested legal chain regressed. Do not assume global canonicalization improves Qwen; see results/qwen3-tts-06b-sohee-k2-20260912.json and results/qwen3-tts-06b-sohee-mini-batch1-20260912.json.';
          fs.writeFileSync(providersPath, JSON.stringify(p, null, 2) + '\n');

          const testPath = 'test/tts-arena.test.cjs';
          let t = fs.readFileSync(testPath, 'utf8');
          if (!t.includes("Qwen3-TTS mini-batch는 backend별 전처리 손익이 섞임을 보존한다")) {
            t += `\n\ntest('Qwen3-TTS mini-batch는 backend별 전처리 손익이 섞임을 보존한다', () => {\n  const r = JSON.parse(fs.readFileSync(path.join(ROOT, 'research/tts-arena/results/qwen3-tts-06b-sohee-mini-batch1-20260912.json'), 'utf8'));\n  assert.equal(r.execution.paid_tts_api_calls, 0);\n  assert.equal(r.execution.cloudflare_r2_calls, 0);\n  assert.equal(r.execution.cloudflare_do_calls, 0);\n  assert.equal(r.execution.cloudflare_container_calls, 0);\n  assert.equal(r.source.tts_regenerated_for_judge, false);\n  assert.equal(r.summary.pair_count, 3);\n  assert.equal(r.summary.canonical_better, 1);\n  assert.equal(r.summary.canonical_tied, 1);\n  assert.equal(r.summary.canonical_worse, 1);\n  const legal = r.pairs.find((x) => x.id === 'legal-chain');\n  const date = r.pairs.find((x) => x.id === 'date-range-particle');\n  const kf = r.pairs.find((x) => x.id === 'mil-kf21');\n  assert.equal(legal.raw.semantic_cer, 0);\n  assert.ok(legal.canonical.semantic_cer > legal.raw.semantic_cer);\n  assert.ok(date.canonical.semantic_cer < date.raw.semantic_cer);\n  assert.equal(date.canonical.semantic_cer, 0);\n  assert.equal(kf.raw.semantic_cer, 0);\n  assert.equal(kf.canonical.semantic_cer, 0);\n});\n`;
            fs.writeFileSync(testPath, t);
          }
          NODE
      - name: Run complete static safety suite
        run: |
          node --test test/private-source.test.mjs test/container-cost.test.mjs test/ko-voice.test.cjs test/frontend-invariants.test.cjs test/tts-arena.test.cjs
          python3 server/singleflight.py --selftest
          python3 test/judge_test.py
          python3 -m py_compile server/singleflight.py server/server.py research/judge.py
          node --check public/ko-voice.js
          node --check research/tts-arena/plan.mjs
      - name: Remove one-shot workflow and commit verified evidence
        run: |
          rm .github/workflows/one-shot-qwen-mini-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tts-arena/providers.json research/tts-arena/results/qwen3-tts-06b-sohee-mini-batch1-20260912.json test/tts-arena.test.cjs .github/workflows/one-shot-qwen-mini-evidence.yml
          git commit -m 'research: lock Qwen mini-batch mixed preprocessing evidence'
          git push origin HEAD:research/qwen3-tts-mini-batch1-evidence-20260912

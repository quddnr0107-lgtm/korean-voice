name: Export TB-002 lecture for owner video edit
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [lecture-premium/code/tb002_owner_video_export.py]
permissions:
  contents: read
jobs:
  export:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: admin-law-premium-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download three immutable ciphertext assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bora-fp32-tb-single-pass-v1-20261114 \
            --repo quddnr0107-lgtm/korean-voice --dir "$RUNNER_TEMP/tb002" \
            --pattern 'TB-002.audio.f1ae278b978512ab2ad0da1e656b57f8.bin' \
            --pattern 'TB-002.content.3afa0ea646aa21de8c8a350eda5a75c3.bin' \
            --pattern 'TB-002.descriptor.json'
          python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Recover TB-002 in the offline namespace and seal to the owner edit key
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" \
            -- "$(command -v python)" lecture-premium/code/tb002_owner_video_export.py \
              "$RUNNER_TEMP/tb002" "$RUNNER_TEMP/tb002-owner-envelope.bin" \
              "$(id -u)" "$(readlink /proc/self/ns/net)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb002-owner-envelope
          path: ${{ runner.temp }}/tb002-owner-envelope.bin
          if-no-files-found: error
          retention-days: 1

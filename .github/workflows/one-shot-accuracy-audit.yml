name: One-shot public corpus accuracy audit

on:
  push:
    branches:
      - gpt/accuracy-audit-20260912

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout korean-voice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout public corpus
        uses: actions/checkout@v4
        with:
          repository: quddnr0107-lgtm/militaryapplyhelper
          path: corpus
          persist-credentials: false

      - name: Run static accuracy audit
        run: node .github/scripts/accuracy-audit.cjs

      - name: Remove one-shot audit helpers
        if: always()
        shell: bash
        run: |
          rm -rf corpus
          rm -f .github/scripts/accuracy-audit.cjs .github/workflows/one-shot-accuracy-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-shot accuracy audit helpers'
            git push origin HEAD:gpt/accuracy-audit-20260912
          fi

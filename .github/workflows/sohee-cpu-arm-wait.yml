name: Original FP32 Sohee public ARM64 waiting comparison
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/cpu-arm-wait-request.json']
permissions:
  contents: read
concurrency:
  group: sohee-public-cpu-arm-wait-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Confirm original production and generic fixture experiment
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/runtime.py bora-production/fp32_renderer.py bora-production/pilot_render.py bora-production/quality.py .github/workflows/bora-fp32-production.yml
          python -m unittest discover -s bora-production -p 'test_cpu_arm_wait_benchmark.py' -v
          python -m py_compile bora-production/cpu_arm_wait_benchmark.py
          python -c "import platform; assert platform.machine().lower() in ('aarch64','arm64'); print(platform.machine())"
      - name: Install original FP32 runtime using the official ARM64 wheels
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0+cpu torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check qwen-tts==0.1.1 transformers==4.57.3 soundfile==0.14.0 numpy==2.5.4 scipy==1.18.1
          python -m pip check
      - name: Download and authenticate only the original public fixed-revision model
        run: |
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'bora-production')
          from download_models import require_keyless,QWEN_REQUIRED,MODEL_REPOSITORY,MODEL_REVISION
          from fp32_renderer import verify_assets
          from public_asset_cache import load_manifest
          from huggingface_hub import snapshot_download
          require_keyless()
          root=Path(os.environ['RUNNER_TEMP'])/'sohee-arm-wait-model'
          snapshot_download(MODEL_REPOSITORY,revision=MODEL_REVISION,local_dir=root,allow_patterns=list(QWEN_REQUIRED),max_workers=4)
          hashes={name:entry['sha256'] for name,entry in load_manifest()['models']['qwen']['files'].items()}
          verify_assets(root,QWEN_REQUIRED,MODEL_REVISION,hashes)
          PY
      - name: Compare original ARM64 voice under default and passive wait hints
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: timeout --signal=TERM --kill-after=30s 1300s python bora-production/cpu_arm_wait_benchmark.py run --model "$RUNNER_TEMP/sohee-arm-wait-model" --output "$RUNNER_TEMP/sohee-arm-wait-results"
      - name: Retain only public WAVs and actual ARM64 wait measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sohee-cpu-arm-wait-${{ github.run_id }}
          path: ${{ runner.temp }}/sohee-arm-wait-results
          retention-days: 3
          if-no-files-found: warn

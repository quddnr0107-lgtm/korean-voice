name: Export published course activation metadata

on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/activation-export-request.json']

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned public manifest validators without keys
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Export the verified published index and descriptors
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python bora-production/transport.py export-activation-metadata \
            --request bora-production/activation-export-request.json \
            --out "$RUNNER_TEMP/bora-course-activation-metadata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bora-course-activation-metadata
          path: ${{ runner.temp }}/bora-course-activation-metadata/
          retention-days: 3
          if-no-files-found: error

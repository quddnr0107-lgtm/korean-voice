name: Admin law v3 one-time sealed receiver
on:
  push:
    branches: [admin-law-v2-premium-20261026]
    paths: ['premium-v3-bootstrap/**', '.github/workflows/admin-law-v3-input-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: admin-law-v3-receiver-bootstrap
  cancel-in-progress: false
jobs:
  receiver:
    if: github.run_attempt == 1 && github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: admin-law-premium-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Verify reviewed receiver code before secrets
        run: |
          echo 'ab70ef4a2a796dd68efe17f7b6e81d796294fda3540a065ecd6be6f4d488e05a  premium-v3-bootstrap/bootstrap_receiver.py' | sha256sum -c -
          echo 'd05be2c35198e19721a8e23adac59507dca996edecbc37e70b73b79d6c79d2ef  premium-v3-bootstrap/sealed_ingress.py' | sha256sum -c -
      - name: Create wrapped one-time receiver within protected environment
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          RECEIVER_OUTPUT: ${{ runner.temp }}/receiver-sealed
        run: python premium-v3-bootstrap/bootstrap_receiver.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-law-v3-receiver-${{ github.run_id }}
          path: ${{ runner.temp }}/receiver-sealed/
          if-no-files-found: error
          retention-days: 7

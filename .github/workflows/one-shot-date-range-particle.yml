name: One-shot date range particle patch

on:
  push:
    branches:
      - gpt/date-range-particle-20260912

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce, patch, and verify
        run: node .github/scripts/patch-date-range-particle.cjs
      - name: Commit verified patch and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/scripts/patch-date-range-particle.cjs .github/workflows/one-shot-date-range-particle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize trailing particles on date ranges'
          git push origin HEAD:gpt/date-range-particle-20260912

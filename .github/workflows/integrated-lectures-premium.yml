name: Integrated lectures sealed premium 137
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BAKE-137-PREMIUM to run the approved sealed 137-lesson batch'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: integrated-lectures-premium-v1-20261028
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event.inputs.confirmation == 'BAKE-137-PREMIUM'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0 numpy==2.5.4
      - run: cd lecture-premium && sha256sum -c CODE_SHA256.txt
      - run: python -m unittest discover -s lecture-premium/code -p 'test_*.py'
      - name: Verify offline namespace support before queueing any secret-bearing job
        run: |
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(which python)" -c 'import os,sys,json,socket; routes=open("/proc/net/route").read().splitlines(); print(json.dumps({"uid":os.getuid(),"expected_uid":int(sys.argv[1]),"gid":os.getgid(),"interfaces":socket.if_nameindex(),"ipv4_route_lines":len(routes)}),flush=True); assert os.getuid()==int(sys.argv[1]), "namespace UID mismatch"; assert len(routes)==1, "namespace IPv4 routes present"; print("offline_namespace_verified")' "$(id -u)"
      - run: python lecture-premium/code/preflight.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python lecture-premium/code/delivery.py prepare --queue lecture-premium/queue.json
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: admin-law-premium-production
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ORT_DISABLE_TELEMETRY: '1'
      LESSON_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cd lecture-premium && sha256sum -c CODE_SHA256.txt
      - name: Private temporary paths, no secrets
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/lecture-assets" "$RUNNER_TEMP/lecture-receiver" "$RUNNER_TEMP/lecture-checkpoint" "$RUNNER_TEMP/lecture-cipher-output"
          {
            echo "LECTURE_JOB_STARTED_AT=$(date +%s)"
            echo "LECTURE_MODEL_ROOT=$RUNNER_TEMP/lecture-assets"
            echo "LECTURE_RECEIVER_DIR=$RUNNER_TEMP/lecture-receiver"
            echo "LECTURE_CHECKPOINT_DIR=$RUNNER_TEMP/lecture-checkpoint"
            echo "LECTURE_OUTPUT=$RUNNER_TEMP/lecture-cipher-output"
          } >> "$GITHUB_ENV"
      - run: python -m pip install --disable-pip-version-check -r lecture-premium/requirements.txt
      - name: Pinned official model, no secrets
        run: python lecture-premium/code/download_model.py "$LECTURE_MODEL_ROOT"
      - name: Pinned wrapped receiver and encrypted resume data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python lecture-premium/code/delivery.py receiver --destination "$LECTURE_RECEIVER_DIR"
          python lecture-premium/code/delivery.py fetch --id "$LESSON_ID" --destination "$LECTURE_CHECKPOINT_DIR"
      - name: Offline protected decrypt, synthesize and encrypt
        id: synth
        env:
          ADMIN_LAW_PREMIUM_SOURCE_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_SOURCE_KEY_B64 }}
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_SOURCE_KEY_B64,ADMIN_LAW_PREMIUM_MEDIA_KEY_B64,LECTURE_JOB_STARTED_AT,LECTURE_MODEL_ROOT,LECTURE_RECEIVER_DIR,LECTURE_CHECKPOINT_DIR,LECTURE_OUTPUT,ORT_DISABLE_TELEMETRY,OMP_NUM_THREADS,OPENBLAS_NUM_THREADS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- "$(which python)" lecture-premium/code/render_sealed.py "$LESSON_ID"
      - name: Ciphertext-only immutable release delivery or failure checkpoint
        if: always() && steps.synth.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python lecture-premium/code/delivery.py publish --id "$LESSON_ID" --directory "$LECTURE_OUTPUT"
  verify:
    if: needs.plan.result == 'success' && needs.render.result == 'success'
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - run: cd lecture-premium && sha256sum -c CODE_SHA256.txt
      - name: Index only after all 137 encrypted outputs verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python lecture-premium/code/delivery.py finalize --queue lecture-premium/queue.json

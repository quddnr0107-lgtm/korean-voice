name: Owner-only MS archived audio export

on:
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths: [bora-production/ms147_owner_export.py, bora-production/test_ms147_owner_export.py, .github/workflows/ms147-owner-video-export.yml]
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/ms147-owner-video-export.yml]

permissions:
  contents: read

concurrency:
  group: ms147-owner-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: scope
        name: Validate the exact lesson list and recipient key without production access
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python -m unittest discover -s bora-production -p test_ms147_owner_export.py
          matrix="$(python bora-production/ms147_owner_export.py matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  export:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    needs: scope
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: admin-law-premium-production
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      OWNER_EXPORT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and validate the immutable encrypted release inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python bora-production/ms147_owner_export.py download "$OWNER_EXPORT_SHARD" "$RUNNER_TEMP/owner-inputs"
      - name: Match the original voice and timing offline and seal to the owner edit key
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" bora-production/ms147_owner_export.py export \
            "$OWNER_EXPORT_SHARD" "$RUNNER_TEMP/owner-inputs" "$RUNNER_TEMP/owner-output" \
            "$(id -u)" "$(readlink /proc/self/ns/net)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-${{ matrix.shard }}
          path: ${{ runner.temp }}/owner-output/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1


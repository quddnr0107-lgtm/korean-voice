name: One-shot champion vs Qwen evidence validation

on:
  push:
    branches:
      - research/champion-vs-qwen-evidence-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/champion-vs-qwen-evidence-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock head-to-head decision in provider note and CI
        run: |
          node <<'NODE'
          const fs=require('fs');
          const providersPath='research/tts-arena/providers.json';
          const p=JSON.parse(fs.readFileSync(providersPath,'utf8'));
          const q=p.providers.find(x=>x.id==='qwen3-tts-0.6b-customvoice-sohee');
          if(!q) throw new Error('Qwen provider missing');
          q.notes='Official Korean support with native Sohee preset. Verified 2026-09-12 on a 4-core GitHub Ubuntu CPU runner. Sampling is required: greedy produced near-silence. Backend-aware preprocessing is required. In the 6-case production-u5 head-to-head, Qwen mean semantic CER was 0.0607 vs u5 0.0330, aggregate RTF 4.065 vs 0.421, and peak RSS 5709.8 MB vs 578.8 MB. Qwen is not a CPU live replacement; its +0.0277 CER delta only qualifies it for one small blind bake A/B. See results/supertonic-u5-vs-qwen-sohee-screen-20260912.json.';
          fs.writeFileSync(providersPath,JSON.stringify(p,null,2)+'\n');

          const testPath='test/tts-arena.test.cjs';
          let t=fs.readFileSync(testPath,'utf8');
          if(!t.includes('u5 대 Qwen 정면전은 CPU live champion을 유지한다')){
            t += `\n\ntest('u5 대 Qwen 정면전은 CPU live champion을 유지한다', () => {\n  const r = JSON.parse(fs.readFileSync(path.join(ROOT, 'research/tts-arena/results/supertonic-u5-vs-qwen-sohee-screen-20260912.json'), 'utf8'));\n  assert.equal(r.execution.paid_tts_api_calls, 0);\n  assert.equal(r.execution.cloudflare_r2_calls, 0);\n  assert.equal(r.execution.cloudflare_do_calls, 0);\n  assert.equal(r.execution.cloudflare_container_calls, 0);\n  assert.equal(r.execution.audio_git_commit, 0);\n  assert.equal(r.pairs.length, 6);\n  assert.ok(r.summary.supertonic.mean_semantic_cer < r.summary.qwen.mean_semantic_cer);\n  assert.ok(r.summary.supertonic.aggregate_rtf < 1);\n  assert.ok(r.summary.qwen.aggregate_rtf > 4);\n  assert.ok(r.summary.derived.qwen_rtf_over_supertonic > 9);\n  assert.ok(r.summary.derived.qwen_peak_rss_over_supertonic > 9);\n  assert.equal(r.summary.decision.live_cpu, 'keep-supertonic-u5');\n  assert.equal(r.summary.decision.qwen_live_candidate, false);\n  assert.equal(r.summary.decision.qwen_blind_bake_challenger, true);\n  assert.ok(r.summary.derived.qwen_minus_supertonic_mean_cer <= 0.03);\n});\n`;
            fs.writeFileSync(testPath,t);
          }
          NODE
      - name: Run complete static safety suite
        run: |
          node --test test/private-source.test.mjs test/container-cost.test.mjs test/ko-voice.test.cjs test/frontend-invariants.test.cjs test/tts-arena.test.cjs
          python3 server/singleflight.py --selftest
          python3 test/judge_test.py
          python3 -m py_compile server/singleflight.py server/server.py research/judge.py
          node --check public/ko-voice.js
          node --check research/tts-arena/plan.mjs
      - name: Remove one-shot workflow and commit verified evidence
        run: |
          rm .github/workflows/one-shot-champion-vs-qwen-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tts-arena/providers.json research/tts-arena/results/supertonic-u5-vs-qwen-sohee-screen-20260912.json test/tts-arena.test.cjs .github/workflows/one-shot-champion-vs-qwen-evidence.yml
          git commit -m 'research: lock u5 vs Qwen head-to-head decision'
          git push origin HEAD:research/champion-vs-qwen-evidence-20260912

name: Owner-only MS archived audio export (single approval)

on:
  pull_request:
    branches: [integrated-lectures-premium-20261028]
    paths: [.github/workflows/ms147-owner-single-approval.yml, bora-production/ms147-single-approval-request.json]
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: [bora-production/ms147-single-approval-request.json]

permissions:
  contents: read

concurrency:
  group: ms147-owner-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: scope
        name: Validate the exact lesson list and recipient key without production access
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python -m unittest discover -s bora-production -p test_ms147_owner_export.py
          python - <<'PY_SCOPE'
          import json, os, re
          from pathlib import Path
          path = Path('bora-production/ms147-single-approval-request.json')
          if os.environ['GITHUB_EVENT_NAME'] == 'push' or path.exists():
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 512:
                  raise SystemExit('Missing or invalid owner export request')
              request = json.loads(path.read_text())
              if (set(request) != {'schema', 'nonce'}
                  or request['schema'] != 'ms147-single-owner-export/v1'
                  or not isinstance(request['nonce'], str)
                  or not re.fullmatch('[a-f0-9]{16,64}', request['nonce'])):
                  raise SystemExit('Invalid owner export request schema')
          PY_SCOPE
          matrix="$(python bora-production/ms147_owner_export.py matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  export:
    if: github.repository == 'quddnr0107-lgtm/korean-voice' && github.ref == 'refs/heads/integrated-lectures-premium-20261028' && github.event_name == 'push'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: admin-law-premium-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and validate all pinned ciphertext without a media key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD_PLAN: ${{ needs.scope.outputs.matrix }}
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --disable-pip-version-check cryptography==50.0.0
          python - <<'PY_DISK'
          import os, shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 6_000_000_000:
              raise SystemExit('Insufficient disk for the pinned export')
          PY_DISK
          python - <<'PY_DOWNLOAD'
          import json, os, re, subprocess, sys
          from pathlib import Path
          shards = json.loads(os.environ['SHARD_PLAN'])['shard']
          if shards != [f'ms-{i:02d}' for i in range(1,20)]:
              raise SystemExit('Unexpected owner shard plan')
          root = Path(os.environ['RUNNER_TEMP']) / 'ms-single-input'
          root.mkdir(mode=0o700)
          for shard in shards:
              subprocess.run([sys.executable, 'bora-production/ms147_owner_export.py',
                              'download', shard, str(root / shard)], check=True)
          PY_DOWNLOAD
      - name: Seal every shard offline to the unchanged owner recipient
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/ms-single-input"
          sealed="$RUNNER_TEMP/ms-single-output"
          mkdir -m 700 -- "$sealed"
          host="$(readlink /proc/self/ns/net)"
          for index in $(seq -w 1 19); do
            shard="ms-$index"
            sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
              unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
              "$(command -v python)" bora-production/ms147_owner_export.py export \
              "$shard" "$root/$shard" "$sealed/$shard" "$(id -u)" "$host"
            rm -r -- "$root/$shard"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-01
          path: |
            ${{ runner.temp }}/ms-single-output/ms-01/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-02/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-02
          path: |
            ${{ runner.temp }}/ms-single-output/ms-03/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-04/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-03
          path: |
            ${{ runner.temp }}/ms-single-output/ms-05/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-06/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-04
          path: |
            ${{ runner.temp }}/ms-single-output/ms-07/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-08/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-05
          path: |
            ${{ runner.temp }}/ms-single-output/ms-09/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-10/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-06
          path: |
            ${{ runner.temp }}/ms-single-output/ms-11/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-12/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-07
          path: |
            ${{ runner.temp }}/ms-single-output/ms-13/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-14/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-08
          path: |
            ${{ runner.temp }}/ms-single-output/ms-15/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-16/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-09
          path: |
            ${{ runner.temp }}/ms-single-output/ms-17/*.owner-media.bin
            ${{ runner.temp }}/ms-single-output/ms-18/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-video-ms-pair-10
          path: |
            ${{ runner.temp }}/ms-single-output/ms-19/*.owner-media.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

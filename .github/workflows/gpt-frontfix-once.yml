name: GPT one-shot ko-voice frontend fix
on:
  push:
    branches: [gpt/ko-voice-frontfix-20260911]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/ko-voice-frontfix-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/gpt_frontfix_once.py
      - name: Verify syntax and focused regressions
        run: |
          node --check public/ko-voice.js
          node --test test/ko-voice.test.cjs
      - name: Commit tested patch
        run: |
          git rm .github/workflows/gpt-frontfix-once.yml tools/gpt_frontfix_once.py
          git config user.name "GPT frontend maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ko-voice.js test/ko-voice.test.cjs
          git commit -m "fix: harden Korean frontend chunking and legal normalization"
          git push origin HEAD:gpt/ko-voice-frontfix-20260911

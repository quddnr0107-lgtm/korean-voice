name: GPT one-shot server singleflight patch
on:
  push:
    branches: [gpt/server-singleflight-20260911]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/server-singleflight-20260911
          fetch-depth: 0
      - name: Apply server patch
        run: python3 tools/apply_server_singleflight.py
      - name: Verify singleflight and syntax
        run: |
          python3 server/singleflight.py --selftest
          python3 -m py_compile server/singleflight.py server/server.py
      - name: Commit tested patch and remove one-shot files
        run: |
          git rm .github/workflows/gpt-server-singleflight-once.yml tools/apply_server_singleflight.py
          git config user.name "GPT server maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.py
          git commit -m "fix: deduplicate concurrent TTS cache misses"
          git push origin HEAD:gpt/server-singleflight-20260911

name: Export DR-048 for owner video edit
on:
  push:
    branches: [owner-dr048-video-export]
    paths: [lecture-premium/code/dr048_owner_video_export.py]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: admin-law-premium-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download three immutable ciphertext assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download integrated-lectures-v2-20261028 \
            --repo quddnr0107-lgtm/korean-voice --dir "$RUNNER_TEMP/dr048" \
            --pattern 'DR-048.audio.8cf26d233a4e89fa19c972f8feea0d66.bin' \
            --pattern 'DR-048.content.addcca8c7c0e3389702a4b364fff99fe.bin' \
            --pattern 'DR-048.descriptor.json'
          python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Recover DR-048 in the offline namespace and seal to the owner edit key
        env:
          ADMIN_LAW_PREMIUM_MEDIA_KEY_B64: ${{ secrets.ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 }}
        run: |
          umask 077
          sudo --preserve-env=ADMIN_LAW_PREMIUM_MEDIA_KEY_B64 \
            unshare --net --setgid "$(id -g)" --setuid "$(id -u)" \
            -- "$(command -v python)" lecture-premium/code/dr048_owner_video_export.py \
              "$RUNNER_TEMP/dr048" "$RUNNER_TEMP/dr048-owner-envelope.bin" \
              "$(id -u)" "$(readlink /proc/self/ns/net)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dr048-owner-envelope
          path: ${{ runner.temp }}/dr048-owner-envelope.bin
          if-no-files-found: error
          retention-days: 1

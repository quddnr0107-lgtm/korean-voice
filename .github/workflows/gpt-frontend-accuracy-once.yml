name: GPT frontend accuracy one-shot
on:
  push:
    branches: [gpt/frontend-accuracy-20260911]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/frontend-accuracy-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch legal branches and official dotted dates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/ko-voice.js')
          s = p.read_text()

          old_date = r"t = t.replace(/\b(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})\.?(?!\d)/g,"
          new_date = r"t = t.replace(/\b(\d{4})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})\.?(?!\d)/g,"
          assert s.count(old_date) == 1, 'date normalization anchor changed'
          s = s.replace(old_date, new_date, 1)

          anchor = "    // 제6회 · 제3조제2항제1호 → 제육 회 · 제삼 조 제이 항 제일 호\n"
          assert s.count(anchor) == 1, 'legal normalization anchor changed'
          legal = r'''    // 가지조문: 제3조의2 · 제3조의2제1항 → 제삼 조의 이 · 제삼 조의 이 제일 항
    // 뒤에 다른 제N단위가 붙으면 경계를 먼저 만든다. 조사(제3조의2에)는 숫자에 붙여 자연스럽게 읽힌다.
    t = t.replace(/제\s*(\d+)\s*조\s*의\s*(\d+)(?=\s*제\s*\d)/g, (m, n, sub) => '제' + readSino(n) + ' 조의 ' + readSino(sub) + ' ');
    t = t.replace(/제\s*(\d+)\s*조\s*의\s*(\d+)/g, (m, n, sub) => '제' + readSino(n) + ' 조의 ' + readSino(sub));
'''
          s = s.replace(anchor, legal + anchor, 1)
          p.write_text(s)

          p = Path('test/frontend-invariants.test.cjs')
          t = p.read_text()
          corpus_anchor = "  '제12조제3항제2호에 따른 대상자는 21명입니다.',\n];"
          assert t.count(corpus_anchor) == 1, 'corpus anchor changed'
          t = t.replace(corpus_anchor, "  '제12조제3항제2호에 따른 대상자는 21명입니다.',\n  '제3조의2제1항제4호에 따라 2026. 9. 11.부터 시행한다.',\n];", 1)

          test_anchor = "test('production canonical은 중복 쉼표와 핵심 조사 뒤 오분절을 만들지 않는다', () => {"
          assert t.count(test_anchor) == 1, 'test anchor changed'
          extra = r'''test('가지조문과 공포문 점 표기 날짜를 의미 경계대로 읽는다', () => {
  const cases = [
    ['제3조의2', '제삼 조의 이'],
    ['제3조의2에 따라', '제삼 조의 이에 따라'],
    ['제3조의2제1항제4호', '제삼 조의 이 제일 항 제사 호'],
    ['2026. 9. 11.', '이천이십육 년 구 월 십일 일'],
    ['2026 . 9 . 11', '이천이십육 년 구 월 십일 일'],
  ];
  for (const [raw, expected] of cases) assert.strictEqual(K.normalize(raw), expected, raw);
});

'''
          t = t.replace(test_anchor, extra + test_anchor, 1)
          p.write_text(t)
          PY

          node --check public/ko-voice.js
          node --test test/private-source.test.mjs test/container-cost.test.mjs test/ko-voice.test.cjs test/frontend-invariants.test.cjs
          python3 server/singleflight.py --selftest
          python3 -m py_compile server/singleflight.py server/server.py
          git diff --check
      - name: Commit verified patch and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gpt-frontend-accuracy-once.yml
          git add public/ko-voice.js test/frontend-invariants.test.cjs
          git commit -m 'fix: normalize Korean legal branch articles and dotted dates'
          git push origin HEAD:gpt/frontend-accuracy-20260911

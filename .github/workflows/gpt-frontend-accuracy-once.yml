name: GPT frontend accuracy one-shot
on:
  push:
    branches:
      - 'gpt/frontend-accuracy-20260911'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/gpt_frontend_accuracy_patch.py
      - name: Verify frontend and safety regressions
        run: |
          node --check public/ko-voice.js
          node --test test/private-source.test.mjs test/container-cost.test.mjs test/ko-voice.test.cjs test/frontend-invariants.test.cjs
          python3 server/singleflight.py --selftest
          python3 -m py_compile server/singleflight.py server/server.py
          git diff --check
      - name: Commit verified result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gpt-frontend-accuracy-once.yml tools/gpt_frontend_accuracy_patch.py
          git add public/ko-voice.js test/frontend-invariants.test.cjs
          git commit -m 'fix: normalize Korean legal branch articles and dotted dates'
          git push origin HEAD:gpt/frontend-accuracy-20260911

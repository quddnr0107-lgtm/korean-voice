name: Original Sohee CPU code predictor compile trial
on:
  push:
    branches: [integrated-lectures-premium-20261028]
    paths: ['bora-production/cpu-compile-request.json']
permissions:
  contents: read
concurrency:
  group: sohee-public-cpu-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
      MAX_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify isolated public trial and unchanged production files
        run: |
          git diff --exit-code HEAD^ HEAD -- bora-production/request.json bora-production/campaign.json bora-production/recipe.json bora-production/runtime.py bora-production/fp32_renderer.py bora-production/pilot_render.py bora-production/quality.py bora-production/assemble.py .github/workflows/bora-fp32-production.yml
          python -m unittest discover -s bora-production -p 'test_cpu_compile_benchmark.py' -v
          python -m py_compile bora-production/cpu_compile_benchmark.py
          command -v g++
          g++ --version
      - name: Install the original pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check qwen-tts==0.1.1 transformers==4.57.3 soundfile==0.14.0 numpy==2.5.4 scipy==1.18.1
          python -m pip check
      - name: Download only the original revision-pinned CustomVoice model
        run: |
          python - <<'PY'
          import sys,os
          from pathlib import Path
          sys.path.insert(0,'bora-production')
          from download_models import require_keyless,QWEN_REQUIRED,MODEL_REPOSITORY,MODEL_REVISION,verify_assets
          from huggingface_hub import snapshot_download
          require_keyless()
          root=Path(os.environ['RUNNER_TEMP'])/'sohee-compile-model'
          snapshot_download(MODEL_REPOSITORY,revision=MODEL_REVISION,local_dir=root,allow_patterns=list(QWEN_REQUIRED),max_workers=4)
          verify_assets(root,QWEN_REQUIRED)
          PY
      - name: Compare eager with only the code predictor forward compiled on CPU
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/sohee-public-inductor-cache
        run: timeout --signal=TERM --kill-after=30s 1300s python bora-production/cpu_compile_benchmark.py --model "$RUNNER_TEMP/sohee-compile-model" --output "$RUNNER_TEMP/sohee-compile-results"
      - name: Retain only public audio and actual compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sohee-cpu-compile-${{ github.run_id }}
          path: ${{ runner.temp }}/sohee-compile-results
          retention-days: 3
          if-no-files-found: warn

name: Experiment Qwen all speakers Korean screen

on:
  push:
    branches:
      - experiment/qwen-all-speakers-korean-screen-20260912

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zero-cost CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0
          python -m pip install qwen-tts==0.1.1 faster-whisper soundfile
      - name: Generate 9 speakers x 2 Korean cases with one model load
        run: |
          mkdir -p /tmp/qsp/audio
          python - <<'PY'
          import json, resource, time, torch
          import soundfile as sf
          from qwen_tts import Qwen3TTSModel

          speakers = [
            {'name':'Vivian','gender':'female','native':'Chinese','description':'bright slightly edgy young female'},
            {'name':'Serena','gender':'female','native':'Chinese','description':'warm gentle young female'},
            {'name':'Uncle_Fu','gender':'male','native':'Chinese','description':'seasoned low mellow male'},
            {'name':'Dylan','gender':'male','native':'Chinese-Beijing','description':'youthful clear natural male'},
            {'name':'Eric','gender':'male','native':'Chinese-Sichuan','description':'lively slightly husky bright male'},
            {'name':'Ryan','gender':'male','native':'English','description':'dynamic rhythmic male'},
            {'name':'Aiden','gender':'male','native':'English','description':'sunny clear-midrange male'},
            {'name':'Ono_Anna','gender':'female','native':'Japanese','description':'playful light nimble female'},
            {'name':'Sohee','gender':'female','native':'Korean','description':'warm Korean female rich emotion'},
          ]
          cases = [
            ('mil-k2','케이투 전차를 점검한다.'),
            ('ordinary-medium','국방부장관은 전쟁이 없는 때에도 정해진 날수만큼 예비군을 불러 쓸 수 있습니다.'),
          ]
          t0=time.perf_counter()
          model=Qwen3TTSModel.from_pretrained(
            'Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice',
            device_map='cpu', dtype=torch.float32, attn_implementation='sdpa')
          out={'date':'2026-09-12','model':'Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice','model_load_seconds':round(time.perf_counter()-t0,3),'seed':7,'speakers':speakers,'jobs':[]}
          for sp in speakers:
            for cid,text in cases:
              torch.manual_seed(7)
              t=time.perf_counter()
              wavs,sr=model.generate_custom_voice(text=text,language='Korean',speaker=sp['name'],instruct=None,do_sample=True,max_new_tokens=192)
              elapsed=time.perf_counter()-t
              w=wavs[0]
              path=f"/tmp/qsp/audio/{sp['name']}--{cid}.wav"
              sf.write(path,w,sr)
              out['jobs'].append({'speaker':sp['name'],'gender':sp['gender'],'native':sp['native'],'id':cid,'text':text,'synthesis_seconds':round(elapsed,3),'audio_seconds':round(len(w)/sr,3),'sample_rate':int(sr)})
          out['peak_rss_mb']=round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1)
          json.dump(out,open('/tmp/qsp/synth.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Judge all 18 outputs with one Whisper-small model
        run: |
          python - <<'PY'
          import json, pathlib
          from faster_whisper import WhisperModel
          root=pathlib.Path('/tmp/qsp')
          synth=json.load(open(root/'synth.json',encoding='utf-8'))
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          rows=[]
          for j in synth['jobs']:
            p=root/'audio'/f"{j['speaker']}--{j['id']}.wav"
            segs,info=model.transcribe(str(p),language='ko',beam_size=5,vad_filter=True)
            text=' '.join(s.text.strip() for s in segs).strip()
            rows.append({**j,'asr':text,'language_probability':round(info.language_probability,4)})
          json.dump(rows,open(root/'asr.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Compute semantic CER and rank speakers
        run: |
          node - <<'NODE'
          const fs=require('fs'); const K=require('./public/ko-voice.js');
          const synth=JSON.parse(fs.readFileSync('/tmp/qsp/synth.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('/tmp/qsp/asr.json','utf8'));
          const compact=s=>String(s??'').replace(/[^가-힣0-9A-Za-z]/g,'');
          function cer(a,b){a=compact(a);b=compact(b);if(!a)return b?1:0;let d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const cur=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=cur;}}return d[b.length]/a.length;}
          const enriched=rows.map(r=>{const target=K.normalize(r.text), heard=K.normalize(r.asr); return {...r,target_canonical:target,asr_canonical:heard,semantic_cer:+cer(target,heard).toFixed(4)};});
          const ranking=synth.speakers.map(sp=>{const x=enriched.filter(r=>r.speaker===sp.name); return {...sp,mean_semantic_cer:+(x.reduce((a,r)=>a+r.semantic_cer,0)/x.length).toFixed(4),perfect_cases:x.filter(r=>r.semantic_cer===0).length,total_cases:x.length,total_synthesis_seconds:+x.reduce((a,r)=>a+r.synthesis_seconds,0).toFixed(3),total_audio_seconds:+x.reduce((a,r)=>a+r.audio_seconds,0).toFixed(3)};}).sort((a,b)=>a.mean_semantic_cer-b.mean_semantic_cer || a.total_synthesis_seconds-b.total_synthesis_seconds);
          const out={date:'2026-09-12',goal:'screen all official Qwen CustomVoice speakers for Korean voice diversity before occupation-style expansion',execution:{paid_tts_api_calls:0,cloudflare_r2_calls:0,cloudflare_do_calls:0,cloudflare_container_calls:0},model_load_seconds:synth.model_load_seconds,peak_rss_mb:synth.peak_rss_mb,results:enriched,ranking};
          fs.writeFileSync('/tmp/qsp/final.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          NODE
      - name: Upload ephemeral audio and evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen-all-speakers-korean-screen
          retention-days: 1
          path: |
            /tmp/qsp/synth.json
            /tmp/qsp/asr.json
            /tmp/qsp/final.json
            /tmp/qsp/audio/*.wav

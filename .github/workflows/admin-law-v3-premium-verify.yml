name: Admin law v3 anonymous premium asset verification
on:
  push:
    branches: [admin-law-v3-premium-verify-20261027]
    paths: ['premium-verification/scope.json']
permissions:
  contents: read
concurrency:
  group: admin-law-v3-premium-public-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == 1 && github.repository == 'quddnr0107-lgtm/korean-voice'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify reviewed verifier code
        run: echo '1bd29951e66293e6bbc507c1886ac9d756bf0a81197da1adeac7bc02dcee1bab  premium-verification/verify_public.py' | sha256sum -c -
      - name: Anonymous index, ciphertext and Range validation
        env:
          VERIFY_OUTPUT: ${{ runner.temp }}/premium-public-verification.json
        run: python premium-verification/verify_public.py premium-verification/scope.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premium-public-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/premium-public-verification.json
          if-no-files-found: error
          retention-days: 7

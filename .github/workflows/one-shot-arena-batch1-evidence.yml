name: One-shot arena batch1 evidence

on:
  push:
    branches:
      - research/moss-nano-batch1-evidence-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/moss-nano-batch1-evidence-20260912
          fetch-depth: 0
      - name: Promote grounded cases and lock batch evidence
        run: node .github/scripts/patch-arena-batch1-evidence.cjs
      - name: Remove one-shot helpers and commit verified evidence
        run: |
          rm -f .github/scripts/patch-arena-batch1-evidence.cjs
          rm -f .github/workflows/one-shot-arena-batch1-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tts-arena/cases.json research/tts-arena/results/moss-nano-batch1-20260912.json test/tts-arena.test.cjs .github
          git commit -m 'research: lock MOSS Nano batch1 evidence and promote grounded cases'
          git push origin HEAD:research/moss-nano-batch1-evidence-20260912

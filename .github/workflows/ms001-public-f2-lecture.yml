name: MS-001 public statute F2 lesson
on:
  pull_request:
    paths:
      - '.github/workflows/ms001-public-f2-lecture.yml'
permissions:
  contents: read
jobs:
  smoke:
    if: github.head_ref == 'codex/ms001-public-f2-lecture-20261126' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORT_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the existing pinned lecture runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke-env"
          "$RUNNER_TEMP/smoke-env/bin/python" -m pip install --disable-pip-version-check -r lecture-premium/requirements.txt
          "$RUNNER_TEMP/smoke-env/bin/python" -m pip check
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Fetch and verify the existing pinned F2 assets
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          p=json.loads(pathlib.Path('lecture-premium/model-pins.json').read_text())
          assert p['repository']=='Supertone/supertonic-3'
          assert p['revision']=='3cadd1ee6394adea1bd021217a0e650ede09a323'
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'smoke-model'
          for name,expected in p['sha256'].items():
              f=d/name
              f.parent.mkdir(parents=True,exist_ok=True)
              u=p['helper_url'] if name=='py/helper.py' else 'https://huggingface.co/'+p['repository']+'/resolve/'+p['revision']+'/'+name
              with urllib.request.urlopen(u,timeout=120) as response, f.open('wb') as out:
                  import shutil
                  shutil.copyfileobj(response,out)
              digest=hashlib.file_digest(f.open('rb'),'sha256').hexdigest()
              assert digest==expected, name
              print('verified',name,f.stat().st_size)
          PY
      - name: Render complete public military-service Article 1 lesson
        run: |
          cat > "$RUNNER_TEMP/f2-article.py" <<'PY'
          import os, pathlib, sys, time, json, hashlib
          import numpy as np
          import soundfile as sf
          import onnxruntime as ort
          ort.disable_telemetry_events()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'smoke-model'
          sys.path.insert(0,str(root/'py'))
          import helper
          opts=ort.SessionOptions()
          opts.intra_op_num_threads=4
          opts.inter_op_num_threads=1
          base=str(root/'onnx')
          tts=helper.TextToSpeech(helper.load_cfgs(base),helper.load_text_processor(base),*helper.load_onnx_all(base,opts,['CPUExecutionProvider']))
          style=helper.load_voice_style([str(root/'voice_styles/F2.json')])
          # Only public statute excerpts and generic instructional prompts.
          items=[
            (1,"병역법 첫 번째 강의입니다. 이번 시간에는 병역법과 병역법 시행령, 각각 제일조의 목적을 공부하겠습니다.",0.5),
            (2,"먼저 병역법 제일조, 목적입니다.",0.4),
            (3,"이 법은 대한민국 국민의 병역의무에 관하여 규정함을 목적으로 한다.",0.7),
            (4,"핵심은 대한민국 국민, 그리고 병역의무입니다. 법의 목적이 무엇인지를 묻는 문제에서는 이 두 표현을 기억하세요.",0.5),
            (5,"다음은 병역법 시행령 제일조, 목적입니다.",0.4),
            (6,"이 영은 병역법에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.",0.7),
            (7,"시행령의 목적에는 두 가지가 있습니다. 첫째, 병역법에서 위임된 사항. 둘째, 그 시행에 필요한 사항입니다.",0.6),
            (8,"법은 국민의 병역의무에 관한 규정이고, 시행령은 법에서 위임된 사항과 시행에 필요한 사항에 관한 규정입니다.",0.5),
            (9,"첫 번째 확인 문제입니다. 병역법 제일조에서 규정하는 것은 대한민국 국민의 무엇입니까?",4),
            (10,"정답은 병역의무입니다.",0.5),
            (11,"두 번째 확인 문제입니다. 시행령의 목적을 구성하는 두 가지 사항을 떠올려 보세요.",4),
            (12,"정답은 병역법에서 위임된 사항과 그 시행에 필요한 사항입니다.",0.6),
            (13,"마지막으로 두 조문을 다시 읽겠습니다. 병역법. 이 법은 대한민국 국민의 병역의무에 관하여 규정함을 목적으로 한다.",0.5),
            (14,"병역법 시행령. 이 영은 병역법에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.",0.6),
            (15,"법과 시행령의 목적을 구별하세요. 이것으로 첫 번째 강의를 마치겠습니다.",0.8)
          ]
          sr=tts.sample_rate
          pieces=[]; spans=[]; cursor=0; started=time.perf_counter()
          for i,(scene,text,pause) in enumerate(items):
              np.random.seed(20261125+i)
              wav,_=tts._infer([text],['ko'],style,16,0.95)
              y=np.asarray(wav,dtype=np.float32).reshape(-1)
              assert np.isfinite(y).all() and float(np.abs(y).max())>0.001 and len(y)>sr/2
              # Remove excessive padding only; keep 80/160 ms onset/tail.
              ix=np.flatnonzero(np.abs(y)>max(float(np.max(np.abs(y)))*10**(-48/20),0.0003))
              assert len(ix)
              y=y[max(0,int(ix[0])-int(sr*.08)):min(len(y),int(ix[-1])+1+int(sr*.16))]
              k=min(int(sr*.008),len(y)//2)
              if k: y[:k]*=np.linspace(0,1,k); y[-k:]*=np.linspace(1,0,k)
              y=y.astype(np.float32)
              n=len(y); p=round(sr*pause)
              spans.append({'index':i,'scene':scene,'text':text,'start_sample':cursor,'speech_end_sample':cursor+n,'end_sample':cursor+n+p})
              pieces.extend([y,np.zeros(p,np.float32)])
              cursor+=n+p
              print('RENDERED',i,'samples',n,'pause',p,flush=True)
          audio=np.concatenate(pieces)
          audio*=np.float32(.86/float(np.abs(audio).max()))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'public-law-audio'
          out.mkdir()
          sf.write(str(out/'narration.wav'),audio,sr,subtype='PCM_16')
          meta={'schema':'ms001-public-article1-f2-narration/v1','engine':'Supertonic 3 F2','steps':16,'speed':0.95,'model_revision':'3cadd1ee6394adea1bd021217a0e650ede09a323','sample_rate':sr,'total_samples':cursor,'duration_seconds':cursor/sr,'segments':spans,'ai_generated':True,'independent_listening_verified':False,'elapsed_seconds':time.perf_counter()-started}
          (out/'timeline.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('NARRATION_RESULT',json.dumps({'segments':len(spans),'samples':cursor,'seconds':cursor/sr,'rate':sr,'elapsed':meta['elapsed_seconds']}),flush=True)
          PY
          sudo -n unshare --net -- runuser -u "$USER" -- env RUNNER_TEMP="$RUNNER_TEMP" ORT_DISABLE_TELEMETRY=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 "$RUNNER_TEMP/smoke-env/bin/python" "$RUNNER_TEMP/f2-article.py"
          cd "$RUNNER_TEMP/public-law-audio"
          ffmpeg -hide_banner -loglevel error -i narration.wav -map_metadata -1 -ac 1 -c:a libmp3lame -b:a 96k MS-001-public-F2.mp3
          ffmpeg -hide_banner -loglevel error -i MS-001-public-F2.mp3 -f null -
          rm narration.wav
          sha256sum MS-001-public-F2.mp3 timeline.json > SHA256SUMS
          cp "$RUNNER_TEMP/smoke-model/LICENSE" LICENSE
          test "$(stat -c %s MS-001-public-F2.mp3)" -lt 5000000
          cat SHA256SUMS
      - name: Deliver complete public-source lesson (7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MS-001-public-F2-lesson
          path: ${{ runner.temp }}/public-law-audio/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
